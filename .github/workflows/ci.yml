# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet.
#
# Every job that used the action downloaded its archive from codeload and then a 240 MB SDK. On
# 2026-08-17 that download returned 429 and 503 eight times across the workflows, three of them
# during a release, each time failing in "Set up job" before anything was built. Nothing in this
# repository could retry its way out of it.
#
# global.json states the version, so a runner without a matching SDK fails with a message that says
# so rather than with a target-framework error further along.
name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  # The whole set by hand — on main before a tag, or on a branch whose platform code changed.
  workflow_dispatch:

# THE IR VERIFIER, ON. It is a debug build's by default, and every job here builds
# --configuration Release -- so until this line the verifier ran on no path that went through
# SourceCompiler: not the tooling tests, not the conformance suite, not the examples. The unit
# tests escaped that only because each one passes verify: explicitly, which is a discipline and
# not a guarantee. The first thing it found on being switched on was real: two extension
# overloads on one name in the symbol table.
env:
  LYRIC_VERIFY_IR: "1"

permissions:
  contents: read

# Successive pushes to one branch collapse: the newer run cancels the older, so a slice pushed
# twice in a minute is verified once. The EVENT is part of the key on purpose. Unifying push and
# pull_request would halve the load again — a push to a branch with an open PR does fire both —
# but the run that loses is reported as a cancelled check ON the pull request, which reads as a
# failure and blocks a merge. A duplicate run is cheaper than a red cross that means nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# WHERE THE PLATFORMS RUN (design/v5/spec/11, review 2026-10-07). A pull request checks on Linux
# x86-64 — the C toolchain with its sanitizers, one NativeAOT binary, the conformance gate — and
# builds and tests on Windows too; ARM Linux, Windows and macOS for the C toolchain and the native
# binaries, and the benchmarks, run on main and in a dispatched run. GitHub gave this repository
# about five runners at once, a run here has thirteen jobs, and a job that waits fifteen minutes
# for a runner is cancelled: about one pull request an hour got through, and main showed red runs
# with no red test. The price: a fault on one of those platforms shows after the merge, on main —
# where every tag waits for green anyway.

jobs:
  # Every job is capped well above its normal running time (about 5 minutes). The default cap
  # is SIX HOURS, and a single hanging test once spent all of them twice over — a hang should
  # be a red job with a log, not a burned evening.
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zig (the Lyric 5 runtime tests build C)
        uses: ./.github/actions/setup-zig

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7

  c-toolchain:
    # The C toolchain Lyric 5 compiles through (design/v5/spec/01 C1/C7/C8, 11 T4): zig cc builds
    # and runs natively, cross-builds every Tier 1 triple, and clang's sanitizers report two
    # planted faults. The zig version is pinned in one file.
    name: C toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS takes about 17 minutes of this, its runtime tests the most: the cap is for a hang
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every Tier 1 runner on main and by hand, Linux x86-64 alone otherwise (the head of the file).
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zig
        uses: ./.github/actions/setup-zig

      - name: Build, cross-build and sanitize
        shell: bash
        run: bash tooling/c-smoke/run.sh

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # TSan's shadow memory needs the kernel's older mmap randomization; Ubuntu 24.04 raised it
      # past what the runner's clang supports ("unexpected memory mapping").
      - name: Make room for TSan
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # The runtime (M1): liblyr.a for every Tier 1 triple, and its tests run on this runner — on
      # Linux x86-64 also under ASan+UBSan and TSan (clang), and there without clang they fail.
      # Only this job asks for the sanitizer runs; the whole-suite jobs skip them.
      - name: Runtime tests
        env:
          LYRIC5_SANITIZERS: '1'
        run: dotnet test tests/Lyric5.Tests/Lyric5.Tests.csproj --configuration Release

  lyric5-aot:
    # The seed of the Lyric 5 command line as one NativeAOT binary per Tier 1 target (11 C1). The
    # x86-64 macOS binary is built on the arm64 runner and not run.
    name: lyric5 NativeAOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every Tier 1 target on main and by hand, linux-x64 alone otherwise (the head of the file):
        # linux-x64, linux-arm64, win-x64 and osx-arm64 built and run, osx-x64 built only.
        include: >-
          ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
          && '[{"rid": "linux-x64", "os": "ubuntu-latest", "run": true}, {"rid": "linux-arm64", "os": "ubuntu-24.04-arm", "run": true}, {"rid": "win-x64", "os": "windows-latest", "run": true}, {"rid": "osx-arm64", "os": "macos-latest", "run": true}, {"rid": "osx-x64", "os": "macos-latest", "run": false}]'
          || '[{"rid": "linux-x64", "os": "ubuntu-latest", "run": true}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Lyric5/Lyric5.csproj --configuration Release -r ${{ matrix.rid }} -o aot

      - name: Set up zig (the native binary builds programs with it)
        if: matrix.run
        uses: ./.github/actions/setup-zig

      # The self-report, the front end inside the native binary (M2 S1): hello's IR, with the calls
      # into the seed standard library — and the whole way (S4): hello built and run natively.
      - name: Self-report, the IR of hello, and hello run natively
        if: matrix.run
        shell: bash
        run: |
          lyric5=aot/lyric5; [ "${{ runner.os }}" = "Windows" ] && lyric5=aot/lyric5.exe
          "$lyric5" --version
          "$lyric5" --version | head -1 | grep -q "^lyric 5\.0\.0"
          "$lyric5" build tests/Lyric5.Tests/programs/hello.lyr --emit ir | tee hello.ir
          grep -q "call std.io.println<string>" hello.ir
          grep -q "callimport std.io.consolePut" hello.ir
          "$lyric5" run tests/Lyric5.Tests/programs/hello.lyr | tee hello.out
          grep -qx "Hello, Lyric!" hello.out
          code=0; "$lyric5" run tests/Lyric5.Tests/programs/fib.lyr --profile release || code=$?
          [ "$code" -eq 55 ]

      # Measurement point 1 on this runner, for the record (the ratchets are the Linux tests in
      # Lyric5.Tests): the program's own start and a warm `run`, the minimum of several.
      - name: Start times
        if: matrix.run
        shell: bash
        run: |
          lyric5=aot/lyric5; [ "${{ runner.os }}" = "Windows" ] && lyric5=aot/lyric5.exe
          "$lyric5" build tests/Lyric5.Tests/programs/hello.lyr --profile release
          # Depth 2: out/release/<triple>/hello — a macOS .dSYM keeps another 'hello' deeper down.
          hello=$(find out/release -maxdepth 2 -type f \( -name 'hello' -o -name 'hello.exe' \) | head -1)
          python3 - "$hello" "$lyric5" <<'PY'
          import subprocess, sys, time
          def best(cmd, n):
              m = 1e9
              for _ in range(n):
                  t = time.perf_counter(); subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL); m = min(m, time.perf_counter() - t)
              return m * 1000
          hello, lyric5 = sys.argv[1], sys.argv[2]
          print(f"hello start:        {best([hello], 20):.1f} ms (min of 20)")
          print(f"lyric5 run warm:    {best([lyric5, 'run', 'tests/Lyric5.Tests/programs/hello.lyr', '--profile', 'release'], 10):.1f} ms (min of 10)")
          print(f"lyric5 --version:   {best([lyric5, '--version'], 10):.1f} ms (min of 10)")
          PY

  bench:
    # Measurement points 2 and 3 (design/v5/spec/13) on this runner, for the record: the table
    # goes into the run's summary. A shared runner is too noisy for the plan's ratchet (1.5x Go),
    # which stays a measurement by hand at each milestone; what fails here is a wide fence of
    # 3x Go — a regression nobody would call noise. 'strings' had a fence of its own, 5x, until
    # f-strings wrote into one builder (M8a S13; it stood at 1.80x on this runner after). The job
    # runs on main and by hand, not on a pull request (the head of the file). Go is the runner's
    # own; nothing is downloaded for it (see the head of this file).
    name: Benchmarks
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zig (the programs build to native binaries)
        uses: ./.github/actions/setup-zig

      - name: Build the compiler
        run: dotnet build src/Lyric5/Lyric5.csproj --configuration Release

      - name: Measure against C, Go and C#
        shell: bash
        run: |
          set -o pipefail
          go version
          python3 bench/run.py --runs 5 --bound 3.0 loops arith structs maps sorting strings | tee -a "$GITHUB_STEP_SUMMARY"

  conformance:
    # The specification's suite (lyriclang/lyric-spec) against the WORKING TREE, in both profiles:
    # the tree is the candidate for 5.0.0, and a candidate that breaks a spec sentence fails here,
    # not after tagging.
    #
    # WHICH specification is the one commit `spec.pin` names — not whatever lyric-spec's main is
    # when the job starts. Spec-first (design/v5/spec/13): the rule and its cases are a pull request
    # there; the compiler's pull request here moves the pin to that pull request's commit, and the
    # two are checked together. The specification merges first, then this side.
    #
    # Until the pin, the job read `main` at run time. That made the order of two merges in two
    # repositories a race: a spec merge that came before its compiler turned this main red
    # (2026-10-03, 777 of 778 cases), and a gate that started a moment before a spec merge checked
    # a compiler against cases it was never meant to meet.
    name: Conformance gate
    runs-on: ubuntu-latest
    # Both profiles, one after the other: 28.7 minutes for 1012 cases (S12d), and 30 cancelled the
    # run of 1014 (S13). Room for the suite to grow until it is split per profile.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the specification's pin
        id: pin
        shell: bash
        run: |
          sha=$(tr -d '[:space:]' < spec.pin)
          echo "$sha" | grep -qE '^[0-9a-f]{40}$' || { echo "spec.pin holds one full commit of lyriclang/lyric-spec and nothing else; it holds '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The whole history: the step after this one asks whether the pin is behind main.
      - name: Checkout the specification
        uses: actions/checkout@v7
        with:
          repository: lyriclang/lyric-spec
          ref: ${{ steps.pin.outputs.sha }}
          path: spec-repo
          fetch-depth: 0

      # A pin on a pull request's commit is how the two sides are checked together; on main it
      # names a text the specification has merged. One that outlived its pull request would hold
      # this repository to a commit nobody finds from the specification's history.
      - name: On main, the pin is on the specification's main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git -C spec-repo fetch --quiet origin main
          git -C spec-repo merge-base --is-ancestor "${{ steps.pin.outputs.sha }}" origin/main || { echo "spec.pin names ${{ steps.pin.outputs.sha }}, which is not on lyric-spec's main: the specification merges first"; exit 1; }

      - name: Set up zig (the cases build to native binaries)
        uses: ./.github/actions/setup-zig

      - name: Build the compiler
        run: dotnet build src/Lyric5/Lyric5.csproj --configuration Release

      - name: Run the suite against the working tree, both profiles
        run: |
          lyric5="$PWD/src/Lyric5/bin/Release/net10.0/lyric5"
          version=$("$lyric5" --version | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "working tree claims $version"
          for profile in debug release; do
            python3 spec-repo/tools/run_conformance.py --lyric5 "$lyric5" --profile "$profile" --toolchain-version "$version"
          done
