# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet.
#
# Every job that used the action downloaded its archive from codeload and then a 240 MB SDK. On
# 2026-08-17 that download returned 429 and 503 eight times across the workflows, three of them
# during a release, each time failing in "Set up job" before anything was built. Nothing in this
# repository could retry its way out of it.
#
# global.json states the version, so a runner without a matching SDK fails with a message that says
# so rather than with a target-framework error further along.
name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

# THE IR VERIFIER, ON. It is a debug build's by default, and every job here builds
# --configuration Release -- so until this line the verifier ran on no path that went through
# SourceCompiler: not the tooling tests, not the conformance suite, not the examples. The unit
# tests escaped that only because each one passes verify: explicitly, which is a discipline and
# not a guarantee. The first thing it found on being switched on was real: two extension
# overloads on one name in the symbol table.
env:
  LYRIC_VERIFY_IR: "1"

permissions:
  contents: read

# Successive pushes to one branch collapse: the newer run cancels the older, so a slice pushed
# twice in a minute is verified once. The EVENT is part of the key on purpose. Unifying push and
# pull_request would halve the load again — a push to a branch with an open PR does fire both —
# but the run that loses is reported as a cancelled check ON the pull request, which reads as a
# failure and blocks a merge. A duplicate run is cheaper than a red cross that means nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Every job is capped well above its normal running time (about 5 minutes). The default cap
  # is SIX HOURS, and a single hanging test once spent all of them twice over — a hang should
  # be a red job with a log, not a burned evening.
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zig (the Lyric 5 runtime tests build C)
        uses: ./.github/actions/setup-zig

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 7

  c-toolchain:
    # The C toolchain Lyric 5 compiles through (design/v5/spec/01 C1/C7/C8, 11 T4): zig cc builds
    # and runs natively, cross-builds every Tier 1 triple, and clang's sanitizers report two
    # planted faults. The zig version is pinned in one file.
    name: C toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zig
        uses: ./.github/actions/setup-zig

      - name: Build, cross-build and sanitize
        shell: bash
        run: bash tooling/c-smoke/run.sh

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # TSan's shadow memory needs the kernel's older mmap randomization; Ubuntu 24.04 raised it
      # past what the runner's clang supports ("unexpected memory mapping").
      - name: Make room for TSan
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # The runtime (M1): liblyr.a for every Tier 1 triple, and its tests run on this runner — on
      # Linux x86-64 also under ASan+UBSan and TSan (clang), and there without clang they fail.
      # Only this job asks for the sanitizer runs; the whole-suite jobs skip them.
      - name: Runtime tests
        env:
          LYRIC5_SANITIZERS: '1'
        run: dotnet test tests/Lyric5.Tests/Lyric5.Tests.csproj --configuration Release

  lyric5-aot:
    # The seed of the Lyric 5 command line as one NativeAOT binary per Tier 1 target (11 C1). The
    # x86-64 macOS binary is built on the arm64 runner and not run.
    name: lyric5 NativeAOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest,    run: true }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, run: true }
          - { rid: win-x64,     os: windows-latest,   run: true }
          - { rid: osx-arm64,   os: macos-latest,     run: true }
          - { rid: osx-x64,     os: macos-latest,     run: false }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Lyric5/Lyric5.csproj --configuration Release -r ${{ matrix.rid }} -o aot

      - name: Self-report
        if: matrix.run
        shell: bash
        run: |
          lyric5=aot/lyric5; [ "${{ runner.os }}" = "Windows" ] && lyric5=aot/lyric5.exe
          "$lyric5" --version
          "$lyric5" --version | head -1 | grep -q "^lyric 5\.0\.0"
