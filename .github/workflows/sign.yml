name: Sign

# Signs the run's archives and index with the key of an environment. The job holds the key and so
# runs nothing of the repository: no checkout, no build, no action from outside GitHub, and the one
# program it fetches is pinned by its sum. A trial — a dispatch on a branch, which no environment
# admits — signs the same way with a key made here and thrown away, so the pipeline can be tried
# before it reaches main.
on:
  workflow_call:
    inputs:
      environment:
        description: The environment that holds the key; none for a trial.
        required: false
        type: string
        default: ""
      public_key:
        description: The line of base64 the signatures must hold under; none for a trial.
        required: false
        type: string
        default: ""
      trial:
        required: true
        type: boolean
      minisign_version:
        required: true
        type: string
      minisign_sha256:
        required: true
        type: string
    outputs:
      public_key:
        description: The key the signatures hold under.
        value: ${{ jobs.sign.outputs.public_key }}

permissions: {}

jobs:
  sign:
    name: Sign
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions: {}
    outputs:
      public_key: ${{ steps.sign.outputs.public_key }}

    steps:
      - name: The archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: files

      - name: The index and the sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: index
          path: files

      - name: minisign, by its sum
        env:
          MINISIGN_VERSION: ${{ inputs.minisign_version }}
          MINISIGN_SHA256: ${{ inputs.minisign_sha256 }}
        run: |
          name="minisign-${MINISIGN_VERSION}-linux.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/${name}"
          echo "${MINISIGN_SHA256}  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign 2>/dev/null
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - name: Sign, and check each signature against the key it must hold under
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          TRIAL: ${{ inputs.trial }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/sign.key"
          trap 'rm -f "$key"' EXIT
          if [ "$TRIAL" = "true" ]; then
            MINISIGN_PASSWORD=trial-not-a-secret
            printf '%s\n%s\n' "$MINISIGN_PASSWORD" "$MINISIGN_PASSWORD" | minisign -G -f -p "$RUNNER_TEMP/trial.pub" -s "$key" > /dev/null
            PUBLIC_KEY=$(sed -n 2p "$RUNNER_TEMP/trial.pub")
          else
            if [ -z "${MINISIGN_SECRET_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ] || [ -z "$PUBLIC_KEY" ]; then
              echo "::error::the environment gives no key to sign with"
              exit 1
            fi
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          fi
          mkdir signatures
          for file in files/*; do
            base=$(basename "$file")
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$file" -x "signatures/$base.minisig" > /dev/null
            minisign -V -q -P "$PUBLIC_KEY" -m "$file" -x "signatures/$base.minisig"
            echo "signed $base"
          done
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signatures
          path: signatures/*
          retention-days: 7
