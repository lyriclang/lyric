# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet — see the comment in ci.yml for what that action cost on 2026-08-17.
name: Dev

# The dev channel (design/v5/spec/11 T5): every push to main is built and replaces the rolling
# 'dev' prerelease. No promise of any kind — this is where things are tried before they move into
# a stable release. There is no nightly channel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push supersedes an older run that has not published yet.
# One run per ref: a dispatch that tries the packaging on a branch does not cancel main's publish.
concurrency:
  group: dev-channel-${{ github.ref }}
  cancel-in-progress: true

env:
  LYRIC_VERIFY_IR: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zig (the Lyric 5 runtime tests build C)
        uses: ./.github/actions/setup-zig

      # examples/raylib builds raylib for Linux with the system's X11 and OpenGL (as in ci.yml)
      - name: X11 and OpenGL for the raylib example
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,   triple: x86_64-windows-gnu }
          - { rid: linux-x64,   os: ubuntu-latest,    triple: x86_64-linux-gnu }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, triple: aarch64-linux-gnu }
          - { rid: osx-arm64,   os: macos-latest,     triple: aarch64-macos }
          # Built across the architecture on the ARM runner, run under Rosetta.
          - { rid: osx-x64,     os: macos-latest,     triple: x86_64-macos }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The runner's own .NET 10 where it has one; the download only where it has none —
      # on 2026-10-25 the install script's links answered 409 for hours.
      - name: The preinstalled .NET, if it is 10
        id: dotnet
        shell: bash
        run: dotnet --list-sdks 2>/dev/null | grep -q '^10\.' && echo "have=1" >> "$GITHUB_OUTPUT" || true

      - name: Set up .NET from global.json
        if: steps.dotnet.outputs.have != '1'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The archive is tried as a user meets it: lyric5 builds its runtime with zig.
      - name: Set up zig
        uses: ./.github/actions/setup-zig

      # One version string for every binary in the archive: 5.0.0-dev.<date>+<sha>. MSBuild reads
      # environment variables as properties, so the inner publishes pick it up as well.
      - name: Stamp the dev version
        shell: bash
        run: |
          stamp="5.0.0-dev.$(date -u +%Y%m%d)+${GITHUB_SHA::7}"
          echo "DEV_VERSION=$stamp" >> "$GITHUB_ENV"
          echo "InformationalVersion=$stamp" >> "$GITHUB_ENV"
          echo "IncludeSourceRevisionInInformationalVersion=false" >> "$GITHUB_ENV"

      - name: Publish lyric5 (NativeAOT)
        run: dotnet publish src/Lyric5/Lyric5.csproj --configuration Release -r ${{ matrix.rid }} -o out

      - name: The runtime prebuilt for the target, and the manifest
        shell: bash
        run: dotnet run --project tools/Package --configuration Release -- out --version "$DEV_VERSION" --triple ${{ matrix.triple }}

      - name: Rosetta for the x86-64 binary
        if: matrix.rid == 'osx-x64'
        shell: bash
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: The self-report names the dev version
        shell: bash
        run: |
          lyric5=out/lyric5; [ "${{ runner.os }}" = "Windows" ] && lyric5=out/lyric5.exe
          "$lyric5" --version
          "$lyric5" --version | head -1 | grep -qx "lyric ${DEV_VERSION}"

      - name: Archive
        shell: bash
        run: |
          name="lyric-${DEV_VERSION%%+*}-${GITHUB_SHA::7}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/${name}.zip" "./out/*"
          else
            tar -czf "dist/${name}.tar.gz" -C out .
          fi

      # Unpacked away from the checkout, where no runtime/ above the binary stands in for the
      # archive's own: a program is built and run with what the archive holds, and the 4.x
      # standard library, which lyric5 never reads, is not in it.
      - name: The archive builds and runs a program
        shell: bash
        run: |
          trial="$RUNNER_TEMP/trial"
          rm -rf "$trial" && mkdir -p "$trial/toolchain" "$trial/hello/src"
          archive=$(ls dist/*)
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x -o"$trial/toolchain" "$archive" > /dev/null
            lyric5="$trial/toolchain/lyric5.exe"
          else
            tar -xzf "$archive" -C "$trial/toolchain"
            lyric5="$trial/toolchain/lyric5"
          fi
          dotnet run --project tools/Package --configuration Release --no-build -- verify "$trial/toolchain"
          test -d "$trial/toolchain/runtime/include/lyr" || { echo "the archive holds no runtime"; exit 1; }
          test -f "$trial/toolchain/runtime/lib/${{ matrix.triple }}/debug/liblyr.a" || { echo "the archive holds no prebuilt runtime"; exit 1; }
          test -f "$trial/toolchain/lldb/lyric.lldbinit" || { echo "the archive holds no lyric.lldbinit"; exit 1; }
          test -f "$trial/toolchain/LICENSE" || { echo "the archive holds no LICENSE"; exit 1; }
          test -f "$trial/toolchain/runtime/include/lyric.h" || { echo "the archive holds no lyric.h"; exit 1; }
          test -d "$trial/toolchain/stdlib5" || { echo "the archive holds no stdlib5"; exit 1; }
          if [ -e "$trial/toolchain/stdlib" ]; then echo "the archive holds the 4.x stdlib"; exit 1; fi
          printf '[package]\nname = "hello"\nversion = "0.1.0"\n' > "$trial/hello/lyric.toml"
          printf 'import std.io { println };\n\nfn main(): void {\n    println("hello from the dev archive");\n}\n' > "$trial/hello/src/main.lyr"
          # A cold cache: the build takes the archive's runtime and compiles none of its own.
          export LYRIC_CACHE="$trial/cache"
          out=$(cd "$trial/hello" && "$lyric5" run | tr -d '\r')
          echo "$out"
          [ "$out" = "hello from the dev archive" ]
          if [ -d "$trial/cache/runtime" ]; then echo "the build compiled the runtime beside the prebuilt one"; exit 1; fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  # From main alone: a run dispatched on a branch tries the archives and leaves the channel as it is.
  publish:
    name: Publish dev
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # One moving tag, one prerelease: 'dev' always points at what was built.
      - name: Move the dev tag
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin dev

      - name: Replace the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create dev dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "dev ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Lyric 5 in development, built from main at ${GITHUB_SHA::7}. No promise of any kind. The archive holds lyric5, the Lyric 5 command line as it grows, its standard library (stdlib5/) and the runtime's C source (runtime/), prebuilt for the archive's target (a build with another zig, or for another target, builds it from the source on first use). Each archive lists its files in toolchain.json. Building a program needs zig on the PATH." \
            --prerelease
