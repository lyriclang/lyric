# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet — see the comment in ci.yml for what that action cost on 2026-08-17.
name: Dev

# The dev channel (design/v5/spec/11 T5): every push to main is built, signed and replaces what the
# rolling 'dev' prerelease holds. No promise of any kind — this is where things are tried before
# they move into a stable release. There is no nightly channel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and none cut short: a newer push waits for the run on its way and replaces
# one still waiting. One run per ref: a dispatch that tries the packaging on a branch does not hold
# up main's publish.
concurrency:
  group: dev-channel-${{ github.ref }}
  cancel-in-progress: false

env:
  LYRIC_VERIFY_IR: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up zig (the Lyric 5 runtime tests build C)
        uses: ./.github/actions/setup-zig

      # examples/raylib builds raylib for Linux with the system's X11 and OpenGL (as in ci.yml)
      - name: X11 and OpenGL for the raylib example
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  # One stamp for the whole run: the legs of the matrix cannot fall on two sides of midnight.
  stamp:
    name: Stamp the dev version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      stem: ${{ steps.stamp.outputs.stem }}
      date: ${{ steps.stamp.outputs.date }}
      sequence: ${{ steps.stamp.outputs.sequence }}
      trial: ${{ steps.stamp.outputs.trial }}
      minisign_version: ${{ steps.stamp.outputs.minisign_version }}
      minisign_sha256: ${{ steps.stamp.outputs.minisign_sha256 }}
      public_key: ${{ steps.stamp.outputs.public_key }}
      known_hosts: ${{ steps.stamp.outputs.known_hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version, number and pins
        id: stamp
        run: |
          day=$(date -u +%Y%m%d)
          {
            echo "version=5.0.0-dev.${day}+${GITHUB_SHA::7}"
            echo "stem=lyric-5.0.0-dev.${day}-${GITHUB_SHA::7}"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "sequence=$(date -u +%s)"
            [ "$GITHUB_REF" = "refs/heads/main" ] && echo "trial=false" || echo "trial=true"
            echo "minisign_version=$(sed -n 's/^version = //p' tooling/minisign-version)"
            echo "minisign_sha256=$(sed -n 's/^linux = //p' tooling/minisign-version)"
            echo "public_key=$(sed -n 2p tooling/release-keys/dev.pub)"
            echo "known_hosts=$(cat tooling/mirror/known_hosts)"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: [verify, stamp]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.stamp.outputs.version }}
      stem: ${{ needs.stamp.outputs.stem }}

  index:
    name: Index
    needs: [stamp, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > "$RUNNER_TEMP/SHA256SUMS" && cat "$RUNNER_TEMP/SHA256SUMS"

      # The last ten builds: what the channel offers now and this one. Whichever source's index the tool
      # finds good, by its signature; none at all starts the list afresh, so a source that is down or
      # broken costs old versions, never the build. The mirror keeps all ten, GitHub the newest.
      - name: The channel's index
        env:
          VERSION: ${{ needs.stamp.outputs.version }}
          DATE: ${{ needs.stamp.outputs.date }}
          SEQUENCE: ${{ needs.stamp.outputs.sequence }}
        run: |
          mkdir index previous
          cp "$RUNNER_TEMP/SHA256SUMS" index/
          build_index() {
            dotnet run --project tools/Package --configuration Release -- index --channel dev --version "$VERSION" --date "$DATE" --sequence "$SEQUENCE" --archives dist --out index/dev.json --keep 10 "$@"
          }
          built=
          for base in https://dl.lyriclang.de https://github.com/lyriclang/lyric/releases/download/dev; do
            if curl -fsSL --retry 2 --max-time 30 -o previous/dev.json "$base/dev.json" \
              && curl -fsSL --retry 2 --max-time 30 -o previous/dev.json.minisig "$base/dev.json.minisig" \
              && build_index --previous previous/dev.json; then
              echo "built on the index from $base"
              built=1
              break
            fi
          done
          [ -n "$built" ] || build_index
          cat index/dev.json

      - name: Upload the index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: index
          path: index/*
          retention-days: 7

  sign:
    name: Sign
    needs: [stamp, index]
    uses: ./.github/workflows/sign.yml
    with:
      environment: ${{ needs.stamp.outputs.trial != 'true' && 'sign-dev' || '' }}
      public_key: ${{ needs.stamp.outputs.trial != 'true' && needs.stamp.outputs.public_key || '' }}
      trial: ${{ needs.stamp.outputs.trial == 'true' }}
      minisign_version: ${{ needs.stamp.outputs.minisign_version }}
      minisign_sha256: ${{ needs.stamp.outputs.minisign_sha256 }}

  install-trial:
    name: Install trial
    needs: [stamp, sign]
    uses: ./.github/workflows/install-trial.yml
    with:
      channel: dev
      version: ${{ needs.stamp.outputs.version }}
      public_key: ${{ needs.sign.outputs.public_key }}

  # From main alone, as below: the two sources do not wait for each other, so that one failing leaves
  # the other current.
  mirror-upload:
    name: Mirror
    needs: [stamp, install-trial]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/mirror-upload.yml
    with:
      target: dev
      known_hosts: ${{ needs.stamp.outputs.known_hosts }}

  channel-check:
    name: Channel check
    needs: [stamp, publish, mirror-upload]
    uses: ./.github/workflows/channel-check.yml
    with:
      channel: dev
      version: ${{ needs.stamp.outputs.version }}

  # From main alone: a run dispatched on a branch tries everything and leaves the channel as it is.
  publish:
    name: Publish dev
    needs: [stamp, install-trial]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download what was signed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      # One moving tag, one prerelease: 'dev' always points at what was built.
      - name: Move the dev tag
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin dev

      # The new archives go up beside the old, the index last and the old archives after it, so that
      # at no moment does the index on GitHub name an archive that is not there.
      - name: Update the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="dev ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})"
          notes="Lyric 5 in development, built from main at ${GITHUB_SHA::7}. No promise of any kind. The archive holds lyric5, the Lyric 5 command line as it grows, its standard library (stdlib5/) and the runtime's C source (runtime/), prebuilt for the archive's target (a build with another zig, or for another target, builds it from the source on first use). Each archive lists its files in toolchain.json, each file has its minisign signature, and dev.json is the channel's signed index. Building a program needs zig on the PATH."
          if ! gh release view dev --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create dev --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease --verify-tag
          fi
          cd dist
          rest=$(ls | grep -vxF -e dev.json -e dev.json.minisig)
          # shellcheck disable=SC2086
          gh release upload dev $rest --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload dev dev.json dev.json.minisig --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit dev --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease
          gh release view dev --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r asset; do
            [ -e "$asset" ] || gh release delete-asset dev "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
