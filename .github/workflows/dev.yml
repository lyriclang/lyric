# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet — see the comment in ci.yml for what that action cost on 2026-08-17.
name: Dev

# The dev channel (design/v5/spec/11 T5): every push to main is built and replaces the rolling
# 'dev' prerelease. No promise of any kind — this is where things are tried before they move into
# a stable release. There is no nightly channel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push supersedes an older run that has not published yet.
concurrency:
  group: dev-channel
  cancel-in-progress: true

env:
  LYRIC_VERIFY_IR: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zig (the Lyric 5 runtime tests build C)
        uses: ./.github/actions/setup-zig

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # One version string for every binary in the archive: 5.0.0-dev.<date>+<sha>. MSBuild reads
      # environment variables as properties, so the inner publishes pick it up as well.
      - name: Stamp the dev version
        shell: bash
        run: |
          stamp="5.0.0-dev.$(date -u +%Y%m%d)+${GITHUB_SHA::7}"
          echo "DEV_VERSION=$stamp" >> "$GITHUB_ENV"
          echo "InformationalVersion=$stamp" >> "$GITHUB_ENV"
          echo "IncludeSourceRevisionInInformationalVersion=false" >> "$GITHUB_ENV"

      - name: Publish lyric5 (NativeAOT)
        run: dotnet publish src/Lyric5/Lyric5.csproj --configuration Release -r ${{ matrix.rid }} -o out

      - name: The self-report names the dev version
        shell: bash
        run: |
          lyric5=out/lyric5; [ "${{ runner.os }}" = "Windows" ] && lyric5=out/lyric5.exe
          "$lyric5" --version
          "$lyric5" --version | head -1 | grep -qx "lyric ${DEV_VERSION}"

      - name: Archive
        shell: bash
        run: |
          name="lyric-${DEV_VERSION%%+*}-${GITHUB_SHA::7}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/${name}.zip" "./out/*"
          else
            tar -czf "dist/${name}.tar.gz" -C out .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish dev
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # One moving tag, one prerelease: 'dev' always points at what was built.
      - name: Move the dev tag
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin dev

      - name: Replace the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create dev dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "dev ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Lyric 5 in development, built from main at ${GITHUB_SHA::7}. No promise of any kind. The archive holds lyric5, the Lyric 5 command line as it grows." \
            --prerelease
