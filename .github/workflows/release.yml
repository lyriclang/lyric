# The .NET version comes from global.json and the SDK preinstalled on the runner, not from
# actions/setup-dotnet — see the comment in ci.yml for what that action cost on 2026-08-17.
name: Release

# Stable channel. Runs on an annotated tag vX.Y.Z; a tag that does not match is ignored.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The identifier is what makes the archive hold what its name says. Without it every
      # platform got the same portable build and the name was a label, not a fact.
      - name: Publish toolchain
        run: >
          dotnet msbuild build/publish.proj
          -p:PublishRoot=${{ github.workspace }}/out
          -p:Rid=${{ matrix.rid }}

      # The published toolchain packs an example and the RESULT runs — on this job's own
      # platform, which is the one the archive is named after. macOS included since 3.1: the
      # packer folds the payload into __LINKEDIT and re-signs ad-hoc, and this is where that
      # is proved. Header arithmetic is unit-tested anywhere; a signature only macOS accepts
      # or refuses.
      - name: Pack and run an example
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then lyric=out/lyric.exe; packed=hello.exe
          else lyric=out/lyric; packed=hello; fi
          "$lyric" pack examples/hello.lyr -o "$packed"
          "./$packed"

          # The bare stub still answers for itself, everywhere: exit 2 and a word about why.
          code=0; ./out/stubs/${{ matrix.rid }}/lyrstub || code=$?
          [ "$code" -eq 2 ]

          # And on macOS the signature is the thing that decides whether any of it runs at all,
          # so it is checked rather than inferred from the program having started.
          if [ "${{ runner.os }}" = "macOS" ]; then codesign --verify --verbose "./$packed"; fi

      - name: Archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="lyric-${version}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/${name}.zip" "./out/*"
          else
            tar -czf "dist/${name}.tar.gz" -C out .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  publish:
    # The editor clients are not here: vscode-lyric and jetbrains-lyric are their own
    # repositories in the org, released on their own cadence.
    name: Publish release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
