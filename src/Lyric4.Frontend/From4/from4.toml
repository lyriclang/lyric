# What 4.6's library is in Lyric 5, by function: the rule of 12 R2, the function, and its form.
#
# `name`: the same call under another name, in the import too. `form`: the call written anew — `{this}`
# the receiver, `{0}` an argument, in their order and each once, so what stands in them stays as it is
# written and other rules may change it; `{0!}` a copy of an argument's text; `{q}` the module the call
# named, `file.`. With a form, `name` is what the import names instead; without one the function leaves
# the imports. `lambda`: as a value it needs one, the new function being generic. `iterator`: it gave an
# array of strings and gives an iterator of views now, which the rule writes back to what 4.6 gave.
# `throws`: 4.6's did not and this does, so E04 marks it. `statement`: only as a statement has it a form;
# what it answered is gone, and a value is said by hand.

[[free]]
rule = "T11"
from = "std.math.absInt"
lambda = true
name = "abs"

[[free]]
rule = "T11"
from = "std.math.minInt"
lambda = true
name = "min"

[[free]]
rule = "T11"
from = "std.math.maxInt"
lambda = true
name = "max"

[[free]]
rule = "T11"
from = "std.math.clampInt"
lambda = true
name = "clamp"

[[free]]
rule = "T11"
from = "std.math.signInt"
lambda = true
name = "signum"

[[free]]
rule = "T11"
from = "std.math.sign"
lambda = true
name = "signum"

# what sum and sumFloat took an array through
[[free]]
rule = "T11"
from = "std.iter.over"
form = "{0}.iter()"

[[free]]
rule = "T11"
from = "std.iter.sum"
form = "{0}.sum()"

[[free]]
rule = "T11"
from = "std.iter.sumFloat"
form = "{0}.sum()"

[[method]]
rule = "T13"
from = "string.substring"
form = "{this}.substring({0}, {0!} + {1}).toString()"

[[method]]
rule = "T14"
from = "string.split"
form = "{this}.split({0})"
iterator = true

[[method]]
rule = "T14"
from = "string.splitLines"
form = "{this}.lines()"
iterator = true

[[method]]
rule = "T16"
from = "string.toChars"
form = "{this}.chars().toArray()"

[[method]]
rule = "T16"
from = "string.utf8Encode"
form = "{this}.bytes()"

[[free]]
rule = "T16"
from = "std.string.utf8Decode"
form = "(try? string.fromUtf8({0}))"

