# What 4.6's library is in Lyric 5, by function: the rule of 12 R2, the function, and its form.
#
# `name`: the same call under another name, in the import too. `form`: the call written anew — `{this}`
# the receiver, `{0}` an argument, in their order and each once, so what stands in them stays as it is
# written and other rules may change it; `{0!}` a copy of an argument's text; `{q}` the module the call
# named, `file.`. With a form, `name` is what the import names instead; without one the function leaves
# the imports. `lambda`: as a value it needs one, the new function being generic. `iterator`: it gave an
# array of strings and gives an iterator of views now, which the rule writes back to what 4.6 gave.
# `throws`: 4.6's did not and this does, so E04 marks it. `statement`: only as a statement has it a form;
# what it answered is gone, and a value is said by hand.
# `hand`: no form; what to write instead is said, and the call stays. `moved`: the module whose import
# names it now. A method's line names its receiver's type: `List.get`, a static one too: `List.empty`.
# `imports`: what a form names that the call did not, `std.time.Instant`. `{0~uint64}`: an argument cast to
# a type, which a literal takes by itself. `review`, `advice`: what changed, said for a proposal.
# `optional`: the form through `?.`; a form without one is said by hand there.
# `std.io.*` in `imports`: a method the form calls comes with the module, whichever way it is imported.
# `walk`: as what a loop walks it is marked `try`, its `next()` throwing.
# `[[elsewhere]]`: a function of 4.6's library the table has no line for and a test may not ask about: another
# rule's business.
# A type of 4.6's library has its line as a function does: `name` is what it is written as, `hand` says what
# stands for it.

