[LYR-SEM0171]
title = "a catch-all clause that nothing reaches"
severity = "warning"
lint = "unreachable-catch"
group = "unused"
level = "warn"
area = "06-errors"
summary = "A `catch` clause without a type (`catch (_)`) follows clauses that already take every error type the `try` block throws."
explanation = '''
The clauses of a `try` are tried in order, and a clause without a type takes what the clauses above it leave. When they take every type the block can throw, the last clause is dead code.

Remove the clause.
'''
wrong = '''
struct NotFound :: [Error] {
    path: string,

    fn message(): string {
        return f"no {this.path}";
    }
}

fn find(p: string): int throws NotFound {
    if (p == "") {
        throw NotFound { path = "empty" };
    }
    return 1;
}

fn main(): void {
    var n = 0;
    try {
        n = find("");
    } catch (e: NotFound) {
        n = e.path.length();
    } catch (_) {
        n = -1;
    }
    assert(n == 5);
}
'''
right = '''
struct NotFound :: [Error] {
    path: string,

    fn message(): string {
        return f"no {this.path}";
    }
}

fn find(p: string): int throws NotFound {
    if (p == "") {
        throw NotFound { path = "empty" };
    }
    return 1;
}

fn main(): void {
    var n = 0;
    try {
