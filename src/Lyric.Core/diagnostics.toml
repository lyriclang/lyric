'''

[LYR-SEM0028]
title = "a type argument that does not satisfy its constraint"
severity = "error"
area = "05-interfaces"
summary = "A type argument, written or inferred, does not conform to an interface its type parameter is constrained by."
explanation = '''
`fn f<T :: [Show]>(…)` accepts only types that conform to `Show`. The check runs where the generic is instantiated — at a call, a type written `Cell<X>`, or a function value `f<X>`.

Pass a type that conforms, or give the type the conformance (`struct Count :: [Show] { … }`).
'''
wrong = '''
