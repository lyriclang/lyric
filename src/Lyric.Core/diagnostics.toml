    let p = Point { x = 1 };
    let _ = p.x;
}
'''

[LYR-SEM0012]
title = "a member the type does not have"
severity = "error"
area = "05-interfaces"
summary = "A member access `x.name` names no field, method or element of the value's type, or reads a member that is a method without calling it (`length` instead of `length()`). A tuple position past its last element is reported here too."
explanation = '''
A member comes from the type's declaration, from its conformances, or from an `extend` block in scope. Built-in members such as an array's `length()` are methods and are called.

Correct the name, call the method, or bring the block that adds the member into scope.
'''
wrong = '''
fn main(): void {
    let xs = [1, 2, 3];
