explanation = '''
A binding's type is written or inferred from its initializer. `null` and an empty array `[]` belong to many types, so they leave the binding without one.

Write the type: `let x: ?string = null;`, `var xs: int[] = [];`.
'''
wrong = '''
fn main(): void {
    let x = null;
