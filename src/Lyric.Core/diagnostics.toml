    }

    fn close(): void throws Broken {
    }
}

fn main(): void {
}
'''
right = '''
struct Empty :: [Iterator, Closeable] {
    type Item = int;

    mut fn next(): ?int {
        return null;
    }

    fn close(): void {
    }
}

fn main(): void {
}
'''

