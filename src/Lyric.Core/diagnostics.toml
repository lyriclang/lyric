summary = "`using var` is written, or a `using` binding takes a pattern or has no value."
explanation = '''
`using let r = open(p);` closes `r` when its scope is left. A `var` could be given another value, and the first one would never be closed; a pattern or a missing value leaves no single value to close.

Write `using let name = value;`.
'''
wrong = '''
class Res :: [Closeable] {
    fn close(): void throws Error { }
}

fn main(): void throws Error {
    using var r = Res { };
}
'''
right = '''
class Res :: [Closeable] {
    fn close(): void throws Error { }
}

fn main(): void throws Error {
    using let r = Res { };
    let _ = r;
}
'''

[LYR-PAR0053]
title = "a visibility word where none or another belongs"
severity = "error"
area = "04-modules"
summary = "A declaration or member has two visibility words (`pub private`), an enum variant has one, or an `import` has one other than `pub`."
explanation = '''
A declaration takes one of `pub`, `internal`, `private`, or none. A variant is as visible as its enum, so the word belongs before `enum`. An import is its module's own; `pub import` passes it on, and no other word stands there.

Keep one word, in its place.
'''
wrong = '''
pub private fn f(): int {
    return 1;
}

fn main(): void {
}
'''
right = '''
private fn f(): int {
    return 1;
}

fn main(): void {
    let _ = f();
}
'''

[LYR-PAR0054]
title = "'&' outside an argument"
severity = "error"
area = "08-expressions"
summary = "The mark `&` stands before an operand that is not an argument of a call — in a binding, an operation, a returned value."
explanation = '''
`&x` passes the place `x` to a parameter that takes a place, `fn bump(&n: int)`. There is no address as a value in Lyric, so the mark stands at an argument and nowhere else.

Remove the `&`, or pass the place to a function that takes one.
'''
wrong = '''
fn main(): void {
    var x = 1;
    let y = &x;
}
'''
right = '''
fn bump(&n: int): void {
    n += 1;
}

fn main(): void {
    var x = 1;
    bump(&x);
    let _ = x;
}
'''

[LYR-PAR0055]
title = "an initializer at the start of a statement"
severity = "error"
area = "03-types"
summary = "A statement begins with `Name { … }` whose braces read as an initializer's: `Point { x = 1 };`, or a call with a trailing block whose assignment lost its `;`, `run { total = 5 }`."
explanation = '''
An initializer builds a value, and a statement that is only an initializer would drop it; at the start of a statement the braces would also read like a block. A trailing block holds statements, so an assignment in it ends with `;` — the note says so when that is the likelier meaning.

Bind the value with `let`, or end the block's statement with `;`.
'''
wrong = '''
struct Point { x: int, y: int }

fn main(): void {
    Point { x = 1, y = 2 };
}
'''
right = '''
struct Point { x: int, y: int }

fn main(): void {
    let p = Point { x = 1, y = 2 };
    let _ = p.x + p.y;
}
'''

[LYR-PAR0056]
title = "a 'throws' behind a function type that is a return type"
severity = "error"
area = "06-errors"
summary = "A declaration's or lambda's return type is a function type without parentheses, followed by `throws`: `fn make(): fn() -> int throws E`."
explanation = '''
The `throws` could be the set of the function returned or of the one that returns it, and a reader cannot tell. Parentheses decide: `(fn() -> int throws E)` returns a function that throws, `(fn() -> int) throws E` gives the set to the one that returns it.

Put the parentheses where you mean them.
'''
wrong = '''
class Negative :: [Error] { fn message(): string { return "negative"; } }

fn fail(): int throws Negative {
    throw Negative { };
}

fn make(): fn() -> int throws Negative {
    return fail;
}

fn main(): void {
}
'''
right = '''
class Negative :: [Error] { fn message(): string { return "negative"; } }

fn fail(): int throws Negative {
    throw Negative { };
}

fn make(): (fn() -> int throws Negative) {
    return fail;
}

fn main(): void {
    let _ = make();
}
'''

[LYR-PAR0057]
title = "an enum's variants not ended by ';' before its members"
severity = "error"
area = "03-types"
summary = "In an enum body a member — `fn`, `static`, an attribute, `type Item =` — stands where the next variant's name is expected: the `;` after the variants is missing."
explanation = '''
An enum lists its variants, separated by `,`, then `;`, then its members. A `,` goes on to the next variant, so a member behind it would be read as one. It is refused once, and the members are read as what they are.

End the variants with `;`.
'''
wrong = '''
enum Level {
    Low, High,
    static let fallback: Level = Level.Low;
}

fn main(): void {
}
'''
right = '''
enum Level {
    Low, High;
    static let fallback: Level = Level.Low;
}

fn main(): void {
    let _ = Level.fallback;
}
'''

[LYR-PAR0058]
title = "'&' before a lambda parameter's pattern"
severity = "error"
area = "03-types"
summary = "A lambda parameter written as a pattern in parentheses carries the place mark `&`: `(&(a, b)) => …`."
explanation = '''
`&n` makes a parameter take the caller's place, which is one named thing. A pattern takes the value apart into new bindings; there is no single place it could stand for.

Take the place with a name, `(&p) => …`, or take the value apart without the mark.
'''
wrong = '''
fn main(): void {
    let f = (&(a, b)) => a;
}
'''
right = '''
fn main(): void {
    let f = ((a, b): (int, int)) => a + b;
    let _ = f((1, 2));
}
'''

[LYR-PAR0059]
title = "comparisons or equalities chained"
severity = "error"
area = "08-expressions"
summary = "A comparison (`<`, `<=`, `>`, `>=`, `in`, `not in`) is followed by another one, or `==` or `!=` by another, as in `a < b < c` or `a == b == c`."
explanation = '''
These operators have no associativity. `a < b < c` would compare the `bool` of `a < b` with `c`, which is never what is meant; `a == b == c` would compare a `bool` with `c` and may even type.

Compare twice and join with `&&`, or group one comparison in parentheses.
'''
wrong = '''
fn main(): void {
    let a = 1;
    let b = 2;
    let c = 3;
    let t = a < b < c;
}
'''
right = '''
fn main(): void {
    let a = 1;
    let b = 2;
    let c = 3;
    let t = a < b && b < c;
    let _ = t;
}
'''

[LYR-PAR0060]
title = "a local function that is not one plain closure"
severity = "error"
area = "03-types"
summary = "A `fn` declared inside a function body has type parameters, a parameter with a default value or a variadic parameter, or has no body."
explanation = '''
A local function is a named closure: one function value, capturing as a lambda does. Type parameters would make it one function per type, which a closure is not; defaults and variadic parameters belong to declared functions. It needs a body, since nothing else could give it one.

Move the function to module level, or drop the type parameters, the default or the variadic parameter.
'''
wrong = '''
fn main(): void {
    fn id<T>(x: T): T {
        return x;
    }
}
'''
right = '''
fn main(): void {
    fn id(x: int): int {
        return x;
    }
    let _ = id(1);
}
'''

[LYR-PAR0061]
title = "a 'comptime if' in expression position without 'else'"
severity = "error"
area = "11-metaprogramming"
summary = "A `comptime if (c) a` stands where a value is taken and has no `else` branch."
explanation = '''
In expression position a `comptime if` chooses between two values at compile time; without `else` there would be no value when the condition is false.

Write the `else` branch.
'''
wrong = '''
import std.meta { fields };

struct Point { x: int, y: int }

fn main(): void {
    var n = 0;
    comptime for (f in fields<Point>()) {
        n = n + comptime if (f.name == "x") 1 2;
    }
    let _ = n;
}
'''
right = '''
import std.meta { fields };

struct Point { x: int, y: int }

fn main(): void {
    var n = 0;
    comptime for (f in fields<Point>()) {
        n = n + comptime if (f.name == "x") 1 else 2;
    }
    let _ = n;
}
'''

[LYR-PAR0062]
title = "a 'comptime for' in an initializer without '[f] = e'"
severity = "error"
area = "11-metaprogramming"
summary = "In an initializer, a `comptime for (f in …)` is followed by something else than an item `[f] = e`."
explanation = '''
A `comptime for` in an initializer sets one field per round, the field its variable names: `Point { comptime for (f in fields<Point>()) [f] = 0 }`. A field written by its own name would be set once per round.

Write the item as `[f] = value`.
'''
wrong = '''
import std.meta { fields };

struct Point { x: int, y: int }

fn main(): void {
    let p = Point { comptime for (f in fields<Point>()) x = 0 };
    let _ = p.x;
}
'''
right = '''
import std.meta { fields };

struct Point { x: int, y: int }

fn main(): void {
    let p = Point { comptime for (f in fields<Point>()) [f] = 0 };
    let _ = p.x;
}
'''

[LYR-PAR0063]
title = "'quote' without a block"
severity = "error"
area = "11-metaprogramming"
summary = "The word `quote` is not followed by `{`."
explanation = '''
A quote is code written as a value, in braces: `quote { a + b }`, `quote { fn f(): void { } }`. Without the braces it holds nothing.

Write the quoted code in braces.
'''
wrong = '''
//- src/main.lyr
import app.macros { one };

fn main(): void {
    let _ = one!();
}
//- src/macros.lyr
import std.syntax { Expr };

pub macro one(): Expr {
    return quote;
}
'''
right = '''
//- src/main.lyr
import app.macros { one };

fn main(): void {
    let _ = one!();
}
//- src/macros.lyr
import std.syntax { Expr };

pub macro one(): Expr {
    return quote { 1 };
}
'''

[LYR-PKG0001]
title = "`lyric.toml` or `lyric.lock` is not valid TOML"
severity = "error"
area = "15-project"
summary = "Reported when the manifest `lyric.toml`, or the lock `lyric.lock`, of any package of the graph does not parse as TOML. The error points at the line and column where reading failed."
explanation = '''
The manifest and the lock are TOML, read before anything else of the package. A file that is not TOML — an unclosed string, a key without a value, a table declared twice — stops the command at the place the reader gave up.

Fix the syntax at the position shown. A damaged `lyric.lock` can also be deleted: a build without `--locked` writes it anew.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0
//- src/main.lyr
fn main(): void {
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"
//- src/main.lyr
fn main(): void {
}
'''

[LYR-PKG0002]
title = "a manifest or lock field that is missing or malformed"
severity = "error"
area = "15-project"
summary = "Reported when `lyric.toml` or `lyric.lock` parses as TOML but a field is missing, has the wrong type, or has a value of the wrong form: a package name or version, an edition, a dependency, a `[[bin]]` entry, a profile, `[native]`, `[trust]`, `[lints]`, a toolchain pin, a locked revision."
explanation = '''
Every key of a manifest has a type and a form: `name` is a lowercase identifier, `version` a semantic version `MAJOR.MINOR.PATCH`, a dependency `{ path = "…" }` or `{ git = "…", tag = "…" }`, a `[[bin]]` entry a `.lyr` file under `src/`. A value of another type or form is refused rather than guessed at, so a manifest means one thing to every toolchain that reads it.

The message names the field and the form it takes. Write the field in that form.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "1.0"
//- src/main.lyr
fn main(): void {
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "1.0.0"
//- src/main.lyr
fn main(): void {
}
'''

[LYR-PKG0003]
title = "a key or section the manifest does not have"
severity = "error"
area = "15-project"
summary = "Reported for a key or section of `lyric.toml` the toolchain does not know — in `[package]`, a dependency, `[[bin]]`, a profile, `[native]`, `[trust]`, `[lints]`, or at the top — and for forms 5.0 does not have: a dependency as a bare version (a registry's form), an `[override]` from git."
explanation = '''
The manifest is strict, as the command line is: a key nobody reads is refused, so a misspelt key never silently leaves its setting at the default. A version alone, `geo = "1.2"`, asks a registry for the package, and Lyric 5.0 has no registry; an override reads a directory.

Correct the key's spelling, or remove it. A dependency is read from a directory, `geo = { path = "../geo" }`, or from a repository, `geo = { git = "…", tag = "v1.2.0" }`.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"
autor = "Ada"
//- src/main.lyr
fn main(): void {
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"
authors = ["Ada"]
//- src/main.lyr
fn main(): void {
}
'''

[LYR-PKG0004]
title = "a dependency's source holds no package of that name"
severity = "error"
area = "15-project"
summary = "Reported when the directory or repository a dependency names has no `lyric.toml`, when the package found there has another name, or when a package read from git names a dependency by a directory. The error points at the line of the declaring manifest."
explanation = '''
A dependency is a name and a source, and the manifest at the source must say the same name: `geo = { path = "libs/geo" }` needs a `libs/geo/lyric.toml` with `name = "geo"`. A package read from git is its repository's content, so a directory beside it is no part of it: it names its own dependencies by git, or the root's `[override]` replaces them.

Check the path or the repository, and the name in the manifest found there.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { path = "libs/geo" }
//- src/main.lyr
fn main(): void {
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { path = "libs/geo" }
//- libs/geo/lyric.toml
[package]
name = "geo"
version = "1.0.0"
//- libs/geo/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- src/main.lyr
import geo { area };

fn main(): void {
    let _ = area(2);
}
'''

[LYR-PKG0005]
title = "one package name read from two sources"
severity = "error"
area = "15-project"
summary = "Reported when the graph asks for a package of one name from two sources — two directories, two repositories, two revisions, or two versions of different lines — and the root's `[override]` does not pick one."
explanation = '''
A program holds one package of each name. Versions of one line of one repository are one package, and the build takes the greatest asked for; any other second source is a conflict the toolchain does not resolve by itself, because either choice could break the package that asked for the other.

Make the dependencies agree, or pick the one in the root manifest: `[override] geo = { path = "…" }` is read wherever the graph asks for `geo`.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { path = "libs/geo" }
map = { path = "libs/map" }
//- libs/geo/lyric.toml
[package]
name = "geo"
version = "1.0.0"
//- libs/geo/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- libs/map/lyric.toml
[package]
name = "map"
version = "1.0.0"

[dependencies]
geo = { path = "../geo2" }
//- libs/geo2/lyric.toml
[package]
name = "geo"
version = "2.0.0"
//- libs/geo2/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- libs/map/src/lib.lyr
import geo { area };

pub fn tiles(r: int): int {
    return area(r) / 2;
}
//- src/main.lyr
import geo { area };
import map { tiles };

fn main(): void {
    let _ = area(2) + tiles(2);
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[override]
geo = { path = "libs/geo" }

[dependencies]
geo = { path = "libs/geo" }
map = { path = "libs/map" }
//- libs/geo/lyric.toml
[package]
name = "geo"
version = "1.0.0"
//- libs/geo/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- libs/map/lyric.toml
[package]
name = "map"
version = "1.0.0"

[dependencies]
geo = { path = "../geo2" }
//- libs/geo2/lyric.toml
[package]
name = "geo"
version = "2.0.0"
//- libs/geo2/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- libs/map/src/lib.lyr
import geo { area };

pub fn tiles(r: int): int {
    return area(r) / 2;
}
//- src/main.lyr
import geo { area };
import map { tiles };

fn main(): void {
    let _ = area(2) + tiles(2);
}
'''

[LYR-PKG0006]
title = "a repository has no such revision or no package at it"
severity = "error"
area = "15-project"
summary = "Reported when a git dependency's repository does not have the tag, branch or commit it names, has no `lyric.toml` at its root at that revision, or holds the package under a tag that is a version at another version than its manifest gives."
explanation = '''
A dependency read from git is the package at the root of the repository, at the revision it names. A revision the repository does not have, or one without a manifest at the root, gives no package. A tag that is a semantic version, `v1.2.0`, is how the build chooses among versions, so it must name the version the manifest at that tag gives.

Check the revision's name against the repository, or tag the commit whose manifest carries the version.
'''
example = '''
$ cat lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { git = "https://example.org/geo", tag = "v2.0.0" }
$ lyric5 build
error[LYR-PKG0006]: https://example.org/geo has no tag 'v2.0.0' for 'geo'
  --> /home/ada/app/lyric.toml:6:1
'''

[LYR-PKG0007]
title = "a git dependency cannot be read"
severity = "error"
area = "15-project"
summary = "Reported when a dependency's repository cannot be cloned or fetched, when `git` is not on the PATH, or when under `--offline` the user's cache does not hold the revision. The exit code is 2: the environment failed, not the manifest."
explanation = '''
Packages from git are read through the user's cache (`~/.cache/lyric/git` on Linux): fetched when the cache lacks the revision, read from it otherwise. When git cannot reach the repository, or is not installed, or `--offline` forbids the fetch the build needs, there is no package to read.

The message quotes git's own first line. Check the URL and the network, install git, or build once without `--offline` to fill the cache.
'''
example = '''
$ lyric5 build
error[LYR-PKG0007]: 'geo' cannot be read from file:///nowhere/geo: fatal: '/nowhere/geo' does not appear to be a git repository
  --> /home/ada/app/lyric.toml:6:1
$ lyric5 build --offline
error[LYR-PKG0007]: 'geo' is read from https://example.org/geo at tag 'v1.0.0', which the cache does not hold, and --offline fetches nothing
  --> /home/ada/app/lyric.toml:6:1
'''

[LYR-PKG0008]
title = "the lock disagrees with the repository"
severity = "error"
area = "15-project"
summary = "Reported when `lyric.lock` holds a commit the dependency's repository does not have, or when the package content at the locked commit is not what the lock's hash says."
explanation = '''
`lyric.lock` records, for each revision read from git, the commit it was and a hash of the package content. A build reads that commit and checks the hash, so the program is built from the same sources everywhere. A commit that has gone — a force-push — or content that differs means the lock no longer describes what the repository holds.

Resolve the dependency anew with `lyric5 update <name>`, which writes the lock from what the repository holds now, and review what changed.
'''
example = '''
$ lyric5 build
error[LYR-PKG0008]: lyric.lock holds commit 1234567890ab of https://example.org/geo for 'geo', which the repository does not have — 'lyric update geo' resolves it anew
  --> /home/ada/app/lyric.toml:6:1
$ lyric5 build
error[LYR-PKG0008]: the content of 'geo' at commit e4ff41cbf4c5 of https://example.org/geo is not what lyric.lock holds — 'lyric update geo' resolves it anew
  --> /home/ada/app/lyric.toml:6:1
'''

[LYR-PKG0009]
title = "a package asks for a newer toolchain"
severity = "error"
area = "15-project"
summary = "Reported when a package of the graph has `toolchain = \"X.Y\"` (or `\">=X.Y\"`) in `[package]` and the running toolchain is older. The exit code is 2."
explanation = '''
`toolchain` in `[package]` is the least toolchain that builds the package: one that uses a feature of 5.1 says so, and an older toolchain refuses it up front rather than failing somewhere in the middle of the compile. A development build of a version counts as that version.

Install the toolchain the message names, or use a version of the package that asks for less.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"
toolchain = "99.0"
//- src/main.lyr
fn main(): void {
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"
toolchain = "5.0"
//- src/main.lyr
fn main(): void {
}
'''

[LYR-PKG0010]
title = "packages that depend on each other in a cycle"
severity = "error"
area = "15-project"
summary = "Reported when a package of the graph depends on itself, directly or through others. The message gives the cycle's path, `app -> geo -> app`, and points at the dependency that closes it."
explanation = '''
A package's dependencies are built before it, and a cycle has no first package. Two packages that need each other are one package, or need a third that holds what they share.

Remove the dependency that closes the cycle: move what both need into one of them, or into a package of its own.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { path = "libs/geo" }
//- libs/geo/lyric.toml
[package]
name = "geo"
version = "1.0.0"

[dependencies]
app = { path = "../.." }
//- libs/geo/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- src/main.lyr
import geo { area };

fn main(): void {
    let _ = area(2);
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { path = "libs/geo" }
//- libs/geo/lyric.toml
[package]
name = "geo"
version = "1.0.0"
//- libs/geo/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- src/main.lyr
import geo { area };

fn main(): void {
    let _ = area(2);
}
'''

[LYR-PKG0011]
title = "`--locked` and a lock that does not match"
severity = "error"
area = "15-project"
summary = "Reported under `--locked` when `lyric.lock` lacks a revision the graph reads from git, holds one it does not read, or is missing although the program reads from git. Nothing is fetched or written."
explanation = '''
`--locked` takes the lock as it is: a build in CI should be built from exactly what was checked in, and a lock that would change is an error rather than a silent update. Without `--locked`, the build writes the lock to match the manifests.

Build once without `--locked` (or run `lyric5 update`) and check the new `lyric.lock` in with `lyric.toml`.
'''
example = '''
$ cat lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { git = "https://example.org/geo", tag = "v1.0.0" }
$ lyric5 build --locked
error[LYR-PKG0011]: 'geo' is read from https://example.org/geo at tag 'v1.0.0', which lyric.lock does not hold — --locked takes the lock as it is; a build without it writes the lock
  --> /home/ada/app/lyric.toml:6:1
'''

[LYR-PKG0012]
title = "a dependency's build script the root does not trust"
severity = "error"
area = "15-project"
summary = "Reported when a dependency has a `build.lyr` and the root manifest's `[trust] build-scripts` does not name it. The build stops before any script runs, at the line that declares the dependency."
explanation = '''
A build script is a program that runs on the machine that builds. The root package's own script always runs; a dependency's runs only where the root says so, so adding a dependency never runs someone else's code unasked.

Read the dependency's script, and if it is acceptable, name the package in the root manifest: `[trust] build-scripts = ["geo"]`.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { path = "libs/geo" }
//- libs/geo/lyric.toml
[package]
name = "geo"
version = "1.0.0"
//- libs/geo/build.lyr
fn main(): void {
}
//- libs/geo/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- src/main.lyr
import geo { area };

fn main(): void {
    let _ = area(2);
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies]
geo = { path = "libs/geo" }

[trust]
build-scripts = ["geo"]
//- libs/geo/lyric.toml
[package]
name = "geo"
version = "1.0.0"
//- libs/geo/build.lyr
fn main(): void {
}
//- libs/geo/src/lib.lyr
pub fn area(r: int): int {
    return 3 * r * r;
}
//- src/main.lyr
import geo { area };

fn main(): void {
    let _ = area(2);
}
'''

[LYR-RES0001]
title = "a name declared twice in one scope"
severity = "error"
area = "04-modules"
summary = "Two declarations take the same name in one scope: a module, a type's members, an `extend` block, an import beside a declaration, or a parameter list. The second is reported; the first stays."
explanation = '''
A name means one thing in a scope. Only functions may share a name, and only when they take different numbers of arguments; any other pair of declarations — two types, a type and a function, an import and a declaration, two parameters — collides.

Rename one of the two, or remove the one that is left over. A parameter that is not used is written `_`, which may repeat.
'''
wrong = '''
struct Point {
    x: int
}

struct Point {
    y: int
}

fn main(): void {
}
'''
right = '''
struct Point {
    x: int
}

struct Size {
    y: int
}

fn main(): void {
}
'''

[LYR-RES0002]
title = "a type name that names no type"
severity = "error"
area = "04-modules"
summary = "A type annotation names a type that is neither declared in the module, imported, a builtin, nor passed on by the prelude."
explanation = '''
A type is found where a value's name is: in the module itself, among its imports, among the builtin types and in what the prelude passes on. Everything else of the standard library — `Any`, for example — is imported like any other module's name.

Declare the type, import it (`import std.core { Any };`), or correct the spelling.
'''
wrong = '''
fn area(s: Shape): int {
    return s.side * s.side;
}

fn main(): void {
}
'''
right = '''
struct Shape {
    side: int
}

fn area(s: Shape): int {
    return s.side * s.side;
}

fn main(): void {
    assert(area(Shape { side = 2 }) == 4);
}
'''

[LYR-RES0003]
title = "an import of a module that does not exist"
severity = "error"
area = "04-modules"
summary = "An `import` names a module that no file provides: no `src/<path>.lyr` in the package, no module of a dependency or of `std` by that path."
explanation = '''
A module is a file, and its name is its path: `app.geometry` is `src/geometry.lyr` of the package `app`, `geo.shapes` is `src/shapes.lyr` of the dependency `geo`. A package's root module `src/lib.lyr` is imported by the package's name alone, never as `<package>.lib`.

Create the file, correct the path, or declare the package that holds it under `[dependencies]` in `lyric.toml`.
'''
wrong = '''
import app.geometry { area };

fn main(): void {
    assert(area(2) == 4);
}
'''
right = '''
//- src/main.lyr
import app.geometry { area };

fn main(): void {
    assert(area(2) == 4);
}
//- src/geometry.lyr
pub fn area(side: int): int {
    return side * side;
}
'''

[LYR-RES0004]
title = "an imported name the module does not declare"
severity = "error"
area = "04-modules"
summary = "A selective import `import m { x };` asks for a name the module `m` neither declares nor passes on with `pub import`."
explanation = '''
A selective import binds names the target module has: what it declares and what it passes on with `pub import`.

Correct the name, import it from the module that declares it, or declare it there.
'''
wrong = '''
//- src/main.lyr
import app.geometry { volume };

fn main(): void {
    assert(volume(2) == 8);
}
//- src/geometry.lyr
pub fn area(side: int): int {
    return side * side;
}
'''
right = '''
//- src/main.lyr
import app.geometry { area };

fn main(): void {
    assert(area(2) == 4);
}
//- src/geometry.lyr
pub fn area(side: int): int {
    return side * side;
}
'''

[LYR-RES0005]
title = "modules that import each other"
severity = "error"
area = "04-modules"
summary = "The imports of the program's modules form a cycle: a module imports, directly or through others, a module that imports it."
explanation = '''
Imports form no cycle. A module's names and its initializers depend on what it imports, and a cycle would leave no order in which they could be ready.

Move what both modules need into a third module that both import, or let the dependency run in one direction only.
'''
wrong = '''
//- src/main.lyr
import app.first { one };

fn main(): void {
    assert(one() == 2);
}
//- src/first.lyr
import app.second { two };

pub fn one(): int {
    return two();
}
//- src/second.lyr
import app.first { one };

pub fn two(): int {
    return 2;
}

pub fn again(): int {
    return one();
}
'''
right = '''
//- src/main.lyr
import app.first { one };

fn main(): void {
    assert(one() == 2);
}
//- src/first.lyr
import app.second { two };

pub fn one(): int {
    return two();
}
//- src/second.lyr
pub fn two(): int {
    return 2;
}
'''

