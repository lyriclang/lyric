fn sum(nums: int..., scale: int): int { return nums.length() * scale; }

fn main(): void {
    let _ = sum;
}
'''
right = '''
fn sum(scale: int, nums: int...): int { return nums.length() * scale; }

fn main(): void {
    let _ = sum;
}
'''

[LYR-SEM0026]
title = "the wrong number of type arguments"
severity = "error"
area = "03-types"
summary = "A generic type, alias or function is given more or fewer type arguments than it declares type parameters (after defaults), or a function that is not generic is given type arguments."
explanation = '''
`Cell<T>` takes one type argument and `Pair<A, B>` two; a type parameter with a default may be left out. A function that is not generic takes none.

Write as many type arguments as the declaration has parameters, or leave them out where the context or the arguments determine them.
'''
