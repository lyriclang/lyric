explanation = '''
A `for` loop over an iterator that is `Closeable` closes it when the loop ends, and the one clause that covers the loop's `next()` calls has to cover that `close()` too. So a closeable iterator's `close()` throws only what its `Error` allows; with no `type Error`, that is nothing (`never`).

