[LYR-RT0019]
title = "a lock poisoned by a panic"
severity = "panic"
area = "10-concurrency"
summary = "A task acquires a `Mutex`, `RwLock` or `Once` whose holder panicked while it held it. The scheduler released the lock and poisoned it; the panic names the first panic's code and message."
program = '''
import std.task { spawn, yieldNow };
import std.sync { Mutex };

fn main(): void throws Error {
    let m = Mutex<int>.new(0);
    let t = spawn(() => {
        try m.lock { &n =>
            n = 1;
            panic("inside");
        };
    });
    while (!t.isDone()) {
        try yieldNow();
    }
    let v = try m.lock { &n => n };
    assert(v == 1);
}
'''

[LYR-SEM0001]
title = "a value of another type than the place takes"
severity = "error"
area = "03-types"
summary = "An expression's type does not fit where it stands: an initializer, an argument, a return value, an assignment. A bare `return;` in a function that returns a value, an integer literal too large for `int`, and an inline-array literal of the wrong length are reported under this code too."
explanation = '''
A place with a declared type takes values of that type and of the types that convert to it implicitly. Lyric widens little on its own: an `int` is no `float`, a `uint` is no `int`, an optional is no value of its inner type, and nothing becomes an interface it does not conform to.

Write a value of the declared type, convert it explicitly (`as` between numbers, a `From`/`Into` method otherwise), or change the declaration.
'''
wrong = '''
fn main(): void {
    let x: int = "text";
    let _ = x;
}
'''
right = '''
fn main(): void {
    let x: int = 5;
    let _ = x;
}
'''

[LYR-SEM0002]
title = "a name that nothing in scope declares"
severity = "error"
area = "04-modules"
