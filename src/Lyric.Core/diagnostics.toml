A byte string is a `uint8[]`: ASCII text and the escapes, `\xNN` for any byte. A character beyond ASCII has no single byte, and `\u{…}` names a character; write their bytes as `\xNN`. An `@` opens an attribute and is one token with the name after it, `@Name`, or opens a group, `@[…]`.

