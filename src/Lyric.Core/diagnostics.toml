fn code(s: ?Signal): int {
    return match (s) { null => 0, _ => 1 };
}

fn main(): void {
    let _ = code(Signal.Red);
}
'''

[LYR-SEM0030]
title = "a thrown, declared or caught type that is not an Error"
severity = "error"
area = "06-errors"
summary = "A `throw` throws a value, a `throws` clause lists a type, or a `catch` names a type that does not conform to `Error`."
explanation = '''
What is thrown is an `Error`: a struct, class or enum that conforms to `Error` (with its `fn message(): string`), an interface value of one, or a type parameter constrained to it. A number or a string is not thrown.

Declare an error type with `:: [Error]` and throw, declare and catch that.
'''
wrong = '''
