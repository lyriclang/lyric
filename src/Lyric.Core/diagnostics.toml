severity = "error"
area = "04-modules"
summary = "An 'extend … :: [Interface]' block carries 'pub', 'internal' or 'private', or one of its methods does."
explanation = '''
A conformance is visible wherever both its type and its interface are: two conformances of one type to `Hashable`, one hidden in a package, would give one `Set` two hash functions. So a conformance block takes no visibility word, and its methods are as visible as the conformance. An inherent `extend` block (without an interface) keeps its word, which is the default for its methods.

Drop the word.
'''
wrong = '''
interface Shape { fn area(): int; }

struct Square { side: int }

private extend Square :: [Shape] {
    fn area(): int { return this.side * this.side; }
}

fn main(): void {
    let _ = Square { side = 2 }.area();
}
'''
right = '''
interface Shape { fn area(): int; }

struct Square { side: int }

extend Square :: [Shape] {
    fn area(): int { return this.side * this.side; }
}

fn main(): void {
    let _ = Square { side = 2 }.area();
}
'''

[LYR-SEM0151]
title = "a declaration names a type less visible than itself"
severity = "error"
area = "04-modules"
summary = "A declaration's signature or type names a type that is less visible than the declaration: a `pub` function returning an internal struct, an internal function taking a private one, a field, constant or inferred binding whose type is narrower than it."
explanation = '''
A declaration is no more visible than the types it names. Whoever may use `origin` must be able to name what it returns and what it takes; a `pub` function that hands out an internal type would give other packages a value they cannot write the type of. The check covers parameter and result types, field types, the types of constants and the inferred type of a binding.

Make the named type as visible as the declaration, or make the declaration narrower.
'''
wrong = '''
struct Point {
    x: int,
}

pub fn origin(): Point {
    return Point { x = 0 };
}

fn main(): void {
    let _ = origin();
}
'''
right = '''
pub struct Point {
    pub x: int,
}

pub fn origin(): Point {
    return Point { x = 0 };
}

fn main(): void {
    let _ = origin();
}
'''

[LYR-SEM0152]
title = "a member is written wider than its type"
severity = "warning"
lint = "visibility-leak"
group = "correctness"
level = "warn"
area = "04-modules"
summary = "A field, method or constant of a struct, class or enum, or a member of an inherent `extend` block (or the block itself), is written with a visibility wider than the type it belongs to."
explanation = '''
A member is reached only through its type, so it is exported only once the type is: `pub x` in an internal struct acts as internal. The program compiles; the warning says that the written word promises more than it gives.

Drop the word, or make the type as visible as the member.
'''
wrong = '''
struct Wide {
    pub x: int,
}

fn main(): void {
    let w = Wide { x = 1 };
    let _ = w.x;
}
'''
right = '''
struct Wide {
    x: int,
}

fn main(): void {
    let w = Wide { x = 1 };
    let _ = w.x;
}
'''

[LYR-SEM0153]
title = "a name hides one of the prelude's"
severity = "warning"
lint = "prelude-shadowing"
group = "correctness"
level = "warn"
area = "04-modules"
summary = "A module declares or imports a name the prelude already gives every module (`assert`, `panic`, `Result`, `Test` …); the module's own wins in that module. The standard library itself is not warned."
explanation = '''
Declaring or importing a name the prelude provides is legal: the module's own binding wins inside that module. It is said because a reader of `assert(x)` takes it for the one every module has. An import that binds the very symbol the prelude passes on hides nothing and is not warned.

Rename the declaration, or import it under another name.
'''
wrong = '''
fn assert(x: bool): void {
}

fn main(): void {
    assert(true);
}
'''
right = '''
fn check(x: bool): void {
}

fn main(): void {
    check(true);
}
'''

[LYR-SEM0154]
title = "a test takes parameters, returns a value or is private"
severity = "error"
area = "11-metaprogramming"
summary = "A function marked `@Test` takes parameters, returns something other than `void`, or is `private`."
explanation = '''
`lyric test` calls every test from a module of its own and with no arguments, and has no use for a value. So a test takes no parameters, returns `void` and is not `private`. It may throw: an error that leaves it fails the test.

Move the inputs into the body, check results with `assert` instead of returning them, and drop `private`.
'''
wrong = '''
@Test
fn answers(): int {
    return 42;
}

fn main(): void {
}
'''
right = '''
@Test
fn answers(): void {
    assert(6 * 7 == 42);
}

fn main(): void {
}
'''

[LYR-SEM0155]
title = "a caller attribute sits on the wrong parameter"
severity = "error"
area = "11-metaprogramming"
summary = "`@callerExpr`, `@callerLine` or `@callerFile` is used where it cannot work: `@callerExpr` names no other parameter of the function, the parameter has the wrong type (`string` for `@callerExpr` and `@callerFile`, `int` for `@callerLine`), or it has no default."
explanation = '''
These attributes fill a parameter that a call leaves out: `@callerExpr(x)` with the source text of the argument written for parameter `x`, `@callerLine` with the call's line, `@callerFile` with its path. So `@callerExpr` names another parameter of the same function, the marked parameter has the type of what it receives, and it has a default, which a call that writes the argument keeps.

Name an existing other parameter, give the parameter the right type, and give it a default.
'''
wrong = '''
fn f(x: int, @callerExpr(y) text: string = ""): string {
    return text;
}

fn main(): void {
    let _ = f(1);
}
'''
right = '''
fn f(x: int, @callerExpr(x) text: string = ""): string {
    return text;
}

fn main(): void {
    let _ = f(1);
}
'''

[LYR-SEM0156]
title = "a place argument or parameter that is no place"
severity = "error"
area = "03-types"
summary = "`&` hands a call something it may not write (a `let`, a temporary, a call's result), or a place parameter `&p` has a default or is `params`/variadic."
explanation = '''
A place parameter `&n` writes into a place the caller holds, and `&x` at the call shows which. That place must be one the caller may write: a `var`, a field or element of one, another place parameter. A `let` or a temporary is no such place. For the same reason a place parameter takes no default and is not `params`: both are values the call makes, not places of the caller's.

Declare the binding `var`, or store the temporary in a `var` first; drop the default or the `params` from a place parameter.
'''
wrong = '''
fn increment(&n: int): void {
    n += 1;
}

fn main(): void {
    let x = 1;
    increment(&x);
}
'''
right = '''
fn increment(&n: int): void {
    n += 1;
}

fn main(): void {
    var x = 1;
    increment(&x);
}
'''

[LYR-SEM0157]
title = "an argument's place mark does not fit its parameter"
severity = "error"
area = "03-types"
summary = "A place parameter's argument is written without `&`, a value parameter's argument with `&`, or a lambda's parameter mark `&n` does not match the function type expected where the lambda stands."
explanation = '''
A call shows what it may write: an argument for a place parameter `&n` is written `&x`, and only such an argument is. The mark is part of the call's text so that a reader sees, at the call, which of the caller's variables change. A lambda marks its parameter `&n` exactly where the function type it stands for hands a place over.

Add `&` before the argument of a place parameter, remove it before the argument of a value parameter, and match a lambda's marks to its expected type.
'''
wrong = '''
fn increment(&n: int): void {
    n += 1;
}

fn main(): void {
    var x = 1;
    increment(x);
}
'''
right = '''
fn increment(&n: int): void {
    n += 1;
}

fn main(): void {
    var x = 1;
    increment(&x);
}
'''

[LYR-SEM0158]
title = "a place outlives the call that handed it over"
severity = "error"
area = "03-types"
summary = "A coroutine function or a generator lambda takes a place parameter, or a lambda captures a place parameter."
explanation = '''
A place belongs to the call and ends with it. A coroutine's or generator's body runs after the call that created it has returned, and a lambda may be called after the function it was made in has returned, so neither may hold the caller's place.

Take the parameter by value, or read the place into a local and capture or yield that.
'''
wrong = '''
fn counts(&n: int): Coroutine<int> {
    yield n;
}

fn main(): void {
    var x = 1;
    let _ = counts(&x);
}
'''
right = '''
fn counts(n: int): Coroutine<int> {
    yield n;
}

fn main(): void {
    let x = 1;
    let _ = counts(x);
}
'''

[LYR-SEM0160]
title = "an associated type's answer does not meet its bound"
severity = "error"
area = "05-interfaces"
summary = "A conforming type (or an `extend` block) answers an associated type with a type that does not conform to the bound the interface declared for it, such as `type Item :: [Named];` answered with `int`."
explanation = '''
An interface that declares `type Item :: [Named];` promises every user of `Self.Item` that it is `Named`; generic code relies on that without knowing the answer. So every answer conforms to the bound, checked where the answer is given.

Answer with a type that conforms to the bound, or make the type conform to it.
