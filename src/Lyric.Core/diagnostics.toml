}
'''

[LYR-SEM0005]
title = "a null operator on a value that is never null"
severity = "error"
area = "03-types"
summary = "A force-unwrap `!`, a `??` or a `??=` is applied to a type that is not optional, so the null case it handles cannot happen. A bare type parameter counts as not optional."
explanation = '''
`x!`, `x ?? d` and `x ??= d` exist for optionals (`?T`). On a value of a non-optional type they do nothing, and writing one says the author believed the value could be null.

Drop the operator, or make the type optional where null is meant to be possible.
'''
wrong = '''
fn main(): void {
    let n: int = 3;
    let _ = n ?? 0;
}
'''
right = '''
fn main(): void {
    let n: ?int = 3;
    let _ = n ?? 0;
}
'''

[LYR-SEM0006]
title = "a conversion that does not exist"
severity = "error"
area = "03-types"
summary = "An `as` between types it does not convert (it converts numbers only, and `char` to and from `uint32`), or an f-string hole whose value has no `Display` conformance or carries a format specifier `Display` does not take."
explanation = '''
`as` converts between the numeric types, and between `char` and `uint32` (its scalar value). A `bool` is not a number, and every other conversion is a method: `T.from(v)` or `v.into()` through a `From` conformance. An f-string renders a hole through `Display`; an optional or a type without the conformance does not render.

Use the conversion the types provide, write the test out (`if (b) 1 else 0`), or give the type `:: [Display]` with `fn show(): string`.
'''
wrong = '''
fn main(): void {
    let b = true;
    let _ = b as int;
}
'''
right = '''
fn main(): void {
    let b = true;
    let _ = if (b) 1 else 0;
}
'''

[LYR-SEM0007]
title = "a value that cannot be indexed or iterated"
severity = "error"
area = "03-types"
