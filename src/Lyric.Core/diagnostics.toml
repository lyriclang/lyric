title = "a condition that is not a bool"
severity = "error"
area = "07-statements"
summary = "The condition of an `if`, `while`, `do … while` or a guard has a type other than `bool`."
explanation = '''
A condition is a `bool`; nothing converts to one. A number is not true when it is non-zero, and an optional is not true when it holds a value.

Write the test out: `n != 0`, `x != null`, `!s.isEmpty()`.
'''
wrong = '''
fn main(): void {
    let n = 3;
    if (n) { let _ = n; }
}
'''
right = '''
fn main(): void {
    let n = 3;
