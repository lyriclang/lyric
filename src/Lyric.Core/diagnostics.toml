explanation = '''
A name in type position resolves to a struct, class, enum, interface, alias or type parameter visible at that point. A misspelling, a missing import, or a function name before `{ … }` (where a trailing block was meant) is the usual cause.

Correct the name or import the type. For a trailing block, write its parameters before `=>`, and end an assignment inside it with `;`.
