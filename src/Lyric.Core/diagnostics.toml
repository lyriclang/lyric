[LYR-SEM0162]
title = "a second loop over the same iterator"
severity = "warning"
lint = "iterator-reused"
group = "correctness"
level = "warn"
area = "07-statements"
summary = "A `for` loop walks a local or parameter that an earlier loop in the same or an enclosing block already walked, with no assignment to it between, and the binding's iterator may be shared (a class, or a type parameter a class may answer)."
explanation = '''
An iterator is not reset by a loop. When the binding holds an object that `iter()` hands back as itself, the second loop goes on where the first stopped, usually at the end, and runs no pass without a word. A struct iterator is copied per loop, and an `Iterable` that makes a new iterator each time starts fresh; neither warns.

Take a fresh iterator for each loop, or walk it once.
'''
wrong = '''
class Ticker :: [Iterator] {
    type Item = int;
    var n: int,

    mut fn next(): ?int {
        if (this.n == 0) { return null; }
        this.n = this.n - 1;
        return this.n;
    }
}

fn main(): void {
    let t = Ticker { n = 3 };
    var sum = 0;
    for (x in t) { sum = sum + x; }
    for (x in t) { sum = sum + x; }
    assert(sum == 3);
}
'''
right = '''
class Ticker :: [Iterator] {
    type Item = int;
    var n: int,

    mut fn next(): ?int {
        if (this.n == 0) { return null; }
        this.n = this.n - 1;
        return this.n;
    }
}

fn main(): void {
    var sum = 0;
    for (x in Ticker { n = 3 }) { sum = sum + x; }
    for (x in Ticker { n = 3 }) { sum = sum + x; }
    assert(sum == 6);
}
'''

[LYR-SEM0163]
title = "a loop's head takes 'try?', 'try!' or a catching form"
severity = "error"
area = "07-statements"
summary = "The source of a `for` loop is marked `try?`, `try!` or with the catching form of `try` instead of the plain `try`."
explanation = '''
A loop's head takes the plain `try` mark only: it covers the source and every `next()` the loop makes. `try?` or `try!` would take the value of the head, and the pulls at every pass would stand outside it, uncaught.

Write `for (x in try source)` and let the error propagate, or put the loop in a `try { … } catch` block to handle what it throws.
'''
wrong = '''
class Fail :: [Error] {
    at: int,

    fn message(): string {
        return f"failed at {this.at}";
    }
}

struct Lines :: [Iterator] {
    type Item = int;
    type Error = Fail;
    var i: int,
    stop: int,

    mut fn next(): ?int throws Fail {
        if (this.i == this.stop) { throw Fail { at = this.i }; }
        this.i = this.i + 1;
        return this.i;
    }
}

fn main(): void {
    var s = 0;
    for (x in try? Lines { i = 0, stop = 3 }) { s = s + x; }
    assert(s >= 0);
}
'''
right = '''
class Fail :: [Error] {
    at: int,

    fn message(): string {
        return f"failed at {this.at}";
    }
}

struct Lines :: [Iterator] {
    type Item = int;
    type Error = Fail;
    var i: int,
    stop: int,

    mut fn next(): ?int throws Fail {
        if (this.i == this.stop) { throw Fail { at = this.i }; }
        this.i = this.i + 1;
        return this.i;
    }
}

fn main(): void {
    var s = 0;
    try {
        for (x in Lines { i = 0, stop = 3 }) { s = s + x; }
    } catch (e: Fail) {
        s = 0 - e.at;
    }
    assert(s >= 0);
}
'''

[LYR-SEM0164]
title = "a format spec in an f-string hole is malformed or does not apply"
severity = "error"
area = "12-stdlib"
summary = "The spec after `:` in an f-string hole is not of the form `[[fill]align][sign][#][0][width][grouping][.precision][type]`, or one of its parts does not apply to the value's type (a sign on a string, a precision on an integer …)."
explanation = '''
A hole `{value:spec}` formats a scalar by the spec, or pads a `Display` value. The spec has one grammar, `[[fill]align][sign][#][0][width][grouping][.precision][type]`, and each part applies to some types only: a precision and `f` or `e` to floats, `x` or `b` to integers, only fill, alignment and width to a type that renders through `Display`. A type that conforms to `Format` reads the spec itself and is not checked here.

Write the spec in that form — `{avg:.2f}`, not the .NET-style `{avg:N2}` — and use only the parts that apply to the value.
'''
wrong = '''
fn main(): void {
    let avg = 2.5;
    assert(f"{avg:N2}" == "2.50");
}
'''
right = '''
fn main(): void {
    let avg = 2.5;
    assert(f"{avg:.2f}" == "2.50");
}
'''

[LYR-SEM0165]
title = "a 'throws' behind a task or coroutine return type is ambiguous"
severity = "error"
area = "10-concurrency"
summary = "A function's return type is a `Task<…>` or `Coroutine<…>` (possibly under `?`) without a thrown set of its own, followed by `throws` without parentheses, so the clause could be the task's or the function's."
explanation = '''
A task and a coroutine may carry a thrown set of their own. In `fn launch(): Task<int> throws Oops` the clause could say that the task may end in `Oops` or that `launch` itself throws it, and the two mean different things to every caller. The compiler does not guess.

Write `(Task<int> throws Oops)` for a task that may end in the error, or `(Task<int>) throws Oops` for a function that throws itself.
'''
wrong = '''
import std.task { spawn, Task };

enum Oops :: [Error] {
    Bad;
    fn message(): string { return "oops"; }
}

fn risky(fail: bool): int throws Oops {
    if (fail) { throw Oops.Bad; }
    return 7;
}

fn launch(): Task<int> throws Oops {
    return spawn(() => try risky(false));
}

fn main(): void {
}
'''
right = '''
import std.task { spawn, Task };

enum Oops :: [Error] {
    Bad;
    fn message(): string { return "oops"; }
}

fn risky(fail: bool): int throws Oops {
    if (fail) { throw Oops.Bad; }
    return 7;
}

fn launch(): (Task<int> throws Oops) {
    return spawn(() => try risky(false));
}

fn main(): void {
}
'''

