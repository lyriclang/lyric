title = "a write to something that cannot be written"
severity = "error"
area = "03-types"
summary = "An assignment, `++`/`--`, an index write or a call of a `mut fn` targets something that is not a writable place: a `let`, a parameter, a field without `var`, a temporary, a module `let`, a value reached through a `let` or through an optional chain."
explanation = '''
Only a place can be written: a `var` local or global, a `var` field reached through writable places, an element of a writable array. A value type is frozen where it is held by a `let`, and a `mut fn` writes its receiver, so it needs a writable one too.

Declare the binding or the field with `var`, or write to a copy held in a `var`.
'''
wrong = '''
fn main(): void {
    let n = 1;
    n = 2;
    let _ = n;
}
'''
right = '''
fn main(): void {
    var n = 1;
    n = 2;
    let _ = n;
}
'''

[LYR-SEM0020]
title = "a conformance that leaves an interface member unimplemented"
severity = "error"
area = "05-interfaces"
summary = "A type or a conformance block declares an interface but does not implement one of its abstract methods, or does not answer one of its static `let`s."
explanation = '''
A conformance `:: [I]` promises every member of `I`. A method with a default in the interface is inherited; every method without one, and every static `let` the interface declares, has to be written by the conforming type.

Implement the missing member, with the signature the interface declares.
'''
wrong = '''
interface Named {
    fn name(): string;
    fn id(): int;
}

struct Tag :: [Named] {
    fn name(): string { return "tag"; }
}

fn main(): void {
    let _ = Tag { }.name();
}
'''
right = '''
interface Named {
    fn name(): string;
    fn id(): int;
}

struct Tag :: [Named] {
    fn name(): string { return "tag"; }
    fn id(): int { return 1; }
}

fn main(): void {
    let _ = Tag { }.name();
}
'''

[LYR-SEM0021]
title = "a missing, duplicated or malformed main"
severity = "error"
area = "04-modules"
summary = "The entry module has no `main`, declares it twice, or declares it with parameters or with a return type other than `void` or `int`."
explanation = '''
A program starts at the `main` of the module the build starts from: `fn main(): void` or `fn main(): int` (the exit code), optionally with `throws`. It takes no parameters — the command-line arguments come from the standard library. A `main` in any other module is an ordinary function.

Declare exactly one `main` of that form, and read the arguments through the standard library.
'''
wrong = '''
fn main(n: int): void {
    let _ = n;
}
'''
right = '''
fn main(): void {
    let n = 1;
    let _ = n;
}
'''

[LYR-SEM0022]
title = "an expression statement without an effect"
severity = "error"
area = "07-statements"
summary = "A statement consists of an expression whose value is discarded and which does nothing else: a literal, a name, an arithmetic expression, a `with`. Only calls, assignments, `++`/`--`, `throw` and loops stand alone."
explanation = '''
An expression computed only to be thrown away is almost always a mistake — a missing assignment, a call without its parentheses, or a value meant to be returned.

Assign the value, return it, or bind it to `_` when it is wanted for its effect only.
'''
wrong = '''
fn main(): void {
    let n = 1;
    n + 1;
}
'''
right = '''
fn main(): void {
    let n = 1;
    let _ = n + 1;
}
'''

[LYR-SEM0023]
title = "a mut function that has nothing to write"
severity = "error"
area = "05-interfaces"
summary = "`mut` is written on a free function, which has no receiver, or on a method of a type that has no `var` field and whose body does not replace `this` (unless an interface demands the method as `mut`)."
explanation = '''
`mut fn` marks a method that writes its receiver; callers have to hand it a writable place. A free function has no receiver, and a method of a type without `var` fields that never assigns `this` writes nothing — the mark would only restrict its callers.

Drop `mut`, or declare the field the method writes with `var`.
'''
wrong = '''
struct Counter {
    n: int,

    mut fn bump(): void { }
}

fn main(): void {
    var c = Counter { n = 0 };
    c.bump();
}
'''
right = '''
struct Counter {
    var n: int,
    mut fn bump(): void { this.n = this.n + 1; }
}

fn main(): void {
    var c = Counter { n = 0 };
    c.bump();
}
'''

[LYR-SEM0024]
title = "a variadic parameter out of place"
severity = "error"
area = "08-expressions"
summary = "A variadic parameter `name: T...` is not the last parameter or has a default, or a parameter is written with Lyric 4's `params`."
explanation = '''
A variadic parameter takes all remaining arguments, so it stands last, and it has no default — given no arguments it is an empty array. Lyric 5 writes it `nums: int...`; `params` is the word of Lyric 4.

Move the variadic parameter to the end, drop its default, and write it with `...`.
'''
