explanation = '''
A suffix names the literal's type: `i8` to `i64` and `u8` to `u64` for integers, `f32` and `f64` for floats. An integer suffix on a literal with a point or an exponent would make a float an integer, and a prefixed literal (`0x`, `0o`, `0b`) is an integer always.

Write a suffix that fits the literal, or convert the value with `as`.
