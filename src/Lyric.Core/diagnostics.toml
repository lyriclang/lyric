'''
right = '''
struct Cell<T> { v: T }

fn main(): void {
    let b: Cell<int> = Cell { v = 1 };
    let _ = b.v;
}
'''

[LYR-SEM0027]
title = "a member of a type parameter that no constraint provides"
severity = "error"
area = "05-interfaces"
summary = "A generic body uses a member on a value of a type parameter (or of an associated type) that none of the parameter's constraints, and no blanket block they admit, declares."
explanation = '''
A generic function is checked once, for every type it may be instantiated with. Inside it, a value of `T` has only the members its constraints promise; that some instantiation's type has the member does not count.

Constrain the parameter by an interface that declares the member (`<T :: [Show]>`).
'''
