area = "08-expressions"
summary = "A call gives fewer arguments than the function's required parameters or more than it takes, or a call with named arguments leaves out a parameter that has no default."
explanation = '''
Every parameter without a default is given an argument; a variadic parameter takes any number of further ones. Named arguments may be reordered, but none of the required parameters may be missing.

Give the missing argument, drop the extra one, or give the parameter a default.
