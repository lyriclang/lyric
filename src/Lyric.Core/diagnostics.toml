interface Named {
    fn name(): string;
}

struct Cat :: [Named] {
    fn name(): string { return "cat"; }
}

interface Holder {
    type Item :: [Named];
    fn item(): Self.Item;
}

struct Crate :: [Holder] {
    type Item = int;
    fn item(): int { return 1; }
}

fn main(): void {
    let _ = Crate {}.item();
    let _ = Cat {}.name();
}
'''
right = '''
interface Named {
    fn name(): string;
}

struct Cat :: [Named] {
    fn name(): string { return "cat"; }
}

interface Holder {
    type Item :: [Named];
    fn item(): Self.Item;
}

struct Crate :: [Holder] {
    type Item = Cat;
    fn item(): Cat { return Cat {}; }
}

fn main(): void {
    let _ = Crate {}.item();
    let _ = Cat {}.name();
}
'''

