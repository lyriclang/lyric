# The diagnostic catalog of the Lyric 5 toolchain (design/v5/spec/11 G9; 13 M12a P4). Every code the
# toolchain reports, in code order. The form of an entry is DiagnosticCatalog's; CatalogTests check each
# against the compiler; the spec's Appendix A is generated from this file (tooling/diagnostics/appendix.py).

[LYR-BLD0001]
title = "the C compiler or the linker failed"
severity = "error"
area = "14-cli"
summary = "Reported by `build`, `run`, `test` and `bench` when compiling the generated C, a package's native C or a build script's C, archiving the runtime, or linking the binary fails. The message carries the command and what the C compiler wrote; the exit code is 2."
explanation = '''
`lyric5` translates the program to C and hands it to a C compiler (`zig cc`, clang or gcc) together with the runtime and the C sources the packages name in `[native]` or through their build scripts. When that step fails, the build stops with this error and the compiler's own output.

The Lyric program itself was accepted; what failed is C. Look at the quoted output: most often a package's own C source does not compile, a library named with `link-lib` or in `[native]` is missing, or the profile needs clang (`asan`, `tsan`) and another compiler was found. A failure in C the toolchain generated is a defect of the toolchain and worth a report.
'''
example = '''
$ cat lyric.toml
[package]
name = "app"
version = "0.1.0"

[native]
sources = ["native/*.c"]
$ cat native/twice.c
#include <stdint.h>
int64_t twice_of(int64_t n) { return n * 2 }
$ lyric5 build
error[LYR-BLD0001]: compiling /home/ada/app/native/twice.c for x86_64-linux-gnu (debug) failed:
zig cc -std=c11 … -c /home/ada/app/native/twice.c -o …
/home/ada/app/native/twice.c:2:43: error: expected ';' after return statement
    2 | int64_t twice_of(int64_t n) { return n * 2 }
      |                                           ^
      |                                           ;
1 error generated.
'''

[LYR-BLD0002]
title = "a package's build script did not build or did not succeed"
severity = "error"
area = "15-project"
summary = "Reported when a package's `build.lyr` does not compile, ends with an exit code other than 0, or does not end within 10 minutes. The package is not built; for a script that ran, what it wrote follows the message."
explanation = '''
A package's `build.lyr` is a program of its own that runs before the package compiles: it writes modules into `gen/`, names C to compile and libraries to link. A package whose script fails cannot be built, because what the script was to produce is missing.

When the script does not compile, its own diagnostics come first and point into `build.lyr` or `build/`. When it ran and failed, the message gives its exit code and the output it wrote, which is also kept in `out/build-script/output.txt`. Fix the script, or what it reads.
'''
wrong = '''
//- build.lyr
fn main(): int {
    return 3;
}
//- src/main.lyr
fn main(): void {
}
'''
right = '''
//- build.lyr
fn main(): void {
}
//- src/main.lyr
fn main(): void {
}
'''

[LYR-BLD0003]
title = "a warning a build script reported"
severity = "warning"
lint = "build-script-warning"
group = "correctness"
level = "warn"
area = "15-project"
summary = "Reported when a package's `build.lyr` calls `std.build.warn`: the build shows the script's message as a warning, prefixed with the package's name."
explanation = '''
A build script talks to the build through directives, not through its own output, which the toolchain keeps to itself. `build.warn(message)` is the directive for something the person building should see: a generated file that is out of date, a native library that was not found and a fallback that was taken.
The warning is the script's; what to do is what its message says. It is the lint `build-script-warning`: `-D build-script-warning`, or a profile's `denyWarnings`, makes it an error that stops the build; a dependency's script warns with `--warn-deps` alone.
The warning is the script's; what to do is what its message says. It does not count toward a profile's `denyWarnings`, which counts the compilation's warnings.
'''
wrong = '''
//- build.lyr
import std.build;

fn main(): void {
    build.warn("the schema is out of date");
}
//- src/main.lyr
fn main(): void {
}
'''
right = '''
//- build.lyr
fn main(): void {
}
//- src/main.lyr
fn main(): void {
}
'''

[LYR-CG0001]
title = "a construct the C backend does not translate"
severity = "error"
area = "16-diagnostics"
summary = "The backend's subset gate meets something in the IR it has no translation for: a native function of the standard library without a runtime call, a host type, an IR instruction or type the emitter does not know. The message names the construct and the milestone that brings it, or says that it is a compiler bug."
explanation = '''
Every function a program reaches is translated to C; the gate before the emitter refuses what has no translation, so that nothing is compiled wrong in silence. A program of the shipped toolchain does not reach it: every native function of `stdlib5` has its runtime call, and a program reaches C only through `extern "C"`. Meeting the code means a standard library without its runtime counterpart, or a bug in the compiler.

Report the program that triggered it, with the message.
'''
example = '''
$ lyric5 build
error[LYR-CG0001]: not yet in Lyric 5: the native function 'std.notyet.tick' (no milestone: a function without a body is the standard library's — a program reaches C through 'extern "C"')
 --> src/main.lyr:6:12
'''

[LYR-CG0002]
title = "a compile-time-only function called at run time"
severity = "error"
area = "12-stdlib"
summary = "The program would call, at run time, a function of `std.syntax` that reads, builds or writes a syntax tree. Reported at every such call the built program reaches, the standard library's own among them."
explanation = '''
A syntax tree exists while the program compiles: macros and `comptime` sites read and write it, and the built program has no parser and no tree. The functions of `std.syntax` therefore have no run-time implementation.

Make the call inside a `comptime` site or a macro, and let the program use its result.
'''
wrong = '''
import std.syntax { parseExpr };

fn main(): void {
    let e = parseExpr("1 + 2");
    assert(e.toSource() == "1 + 2");
}
'''
right = '''
import std.syntax { parseExpr };

fn main(): void {
    let text = comptime parseExpr("1 + 2").toSource();
    assert(text == "1 + 2");
}
'''

[LYR-CLI0001]
title = "a directory or file named on the command line does not exist"
severity = "error"
area = "14-cli"
summary = "Reported when the directory given with `-C`, or the file given to `build`, `run` or `expand`, does not exist. The path is printed as resolved; the exit code is 2."
explanation = '''
`-C <dir>` says where the search for the package starts, and a file named on the command line is taken relative to it. When the directory or the file is not there, there is nothing to look at, and the command stops before reading any manifest.

Check the path: a relative file is relative to `-C`, not to the current directory, when both are given.
'''
example = '''
$ lyric5 build -C nowhere
error[LYR-CLI0001]: no such directory '/home/ada/nowhere'
$ lyric5 build missing.lyr
error[LYR-CLI0001]: no such file '/home/ada/app/missing.lyr'
'''

[LYR-CLI0002]
title = "no C compiler was found"
severity = "error"
area = "14-cli"
summary = "Reported by `build`, `run`, `test` and `bench` when no C compiler is found — `LYRIC_CC`, then `zig`, `clang`, `gcc` on the PATH — or when the profile needs clang (`asan`, `tsan`) and there is none. The exit code is 2."
explanation = '''
`lyric5` builds through C: it needs a C compiler to turn the program and its runtime into a binary. `--emit ir` and `--emit c` print without one; everything that produces a binary needs it.

Install zig (recommended), clang or gcc, or point `LYRIC_CC` at a compiler. The `asan` and `tsan` profiles need clang, whose sanitizer runtimes they link. `lyric5 version` says which compiler was found.
'''
example = '''
$ lyric5 build
error[LYR-CLI0002]: no C compiler found — install zig (recommended), clang or gcc, or set LYRIC_CC
$ lyric5 build --profile asan
error[LYR-CLI0002]: the asan profile needs clang (01 C7), and none was found
'''

[LYR-CLI0003]
title = "a command line the toolchain does not accept"
severity = "error"
area = "14-cli"
summary = "Reported for an unknown verb, option or value, an option without its value, a profile or target that does not exist, a `--bin` the package does not have, a name `remove` or `update` does not find, and for `run` of a binary built for another machine. The exit code is 2."
explanation = '''
The command line is strict: what it does not know is refused rather than ignored, so a typo in an option never builds something other than what was asked for. The message names what was refused and, where the choice is closed, the values that exist.

`lyric5 help` lists the verbs and their options. A binary built with `--target` for another machine is built and kept; `run` refuses to start it and says where it is.
'''
example = '''
$ lyric5 frobnicate
error[LYR-CLI0003]: unknown verb 'frobnicate'
  = help: lyric5 help lists what exists
$ lyric5 build --frob
error[LYR-CLI0003]: unknown option '--frob' for 'build'
  = help: lyric5 help lists what exists
'''

[LYR-CLI0004]
title = "no package here or above"
severity = "error"
area = "14-cli"
summary = "Reported by every verb about a package — `build` and `run` without a file, `expand`, `test`, `bench`, `update`, `clean`, `metadata`, `add`, `remove` — when there is no `lyric.toml` in the directory or any directory above it. The exit code is 2."
explanation = '''
A package is the directory of its `lyric.toml`, and the verbs look for the nearest one at or above the current directory, or above `-C <dir>`. Without one there is nothing to build, test or edit.

Run the command inside a package, give its directory with `-C`, or name a file: `lyric5 build hello.lyr` builds a single file as a package of its own.
'''
example = '''
$ cd /tmp && lyric5 build
error[LYR-CLI0004]: no lyric.toml here or above
  = help: lyric5 build <file.lyr> builds one file alone
'''

[LYR-CLI0005]
title = "a library has no program to run or print"
severity = "error"
area = "14-cli"
summary = "Reported by `run`, `expand` and `build --emit` for a package without `src/main.lyr` and without `[[bin]]` programs: a library. `build` checks such a package instead. The exit code is 2."
explanation = '''
A package without `src/main.lyr` and without a `[[bin]]` table is a library: other packages import it, and it has no `main` of its own. `lyric5 build` checks its modules; there is nothing to run, expand or print.

Run the program that uses the library, or give the library a program: a `src/main.lyr`, or a `[[bin]]` entry in its manifest.
'''
example = '''
$ cat lyric.toml
[package]
name = "geo"
version = "1.0.0"
$ ls src
lib.lyr
$ lyric5 run
error[LYR-CLI0005]: package 'geo' is a library — it has no src/main.lyr and no [[bin]], so there is no program (11 P2)
'''

[LYR-CLI0006]
title = "the external runtime could not be started"
severity = "error"
area = "14-cli"
summary = "Reported by the 4.x drivers when the bytecode VM or another tool they started as a separate process could not be launched."
retired = "Lyric 5: lyric5 builds native binaries and starts no VM; only the 4.x launcher in Lyric.Core reports it, and the M12a S1 denyWarnings error moved to LYR-CLI0016"

[LYR-CLI0007]
title = "several programs and none named"
severity = "error"
area = "15-project"
summary = "Reported by `run`, `expand` and `build --emit` for a package with several programs — `[[bin]]` entries — and no `src/main.lyr`, when `--bin` does not name one. The message lists the programs; the exit code is 2."
explanation = '''
`build` builds every program of a package. `run`, `expand` and `--emit` work on one: the package's `src/main.lyr`, or its only program. With several `[[bin]]` programs and no `src/main.lyr`, choosing one would be a guess.

Name the program with `--bin <name>`, as the message suggests.
'''
example = '''
$ cat lyric.toml
[package]
name = "tools"
version = "0.1.0"

[[bin]]
name = "fmt"
entry = "src/fmt.lyr"

[[bin]]
name = "lint"
entry = "src/lint.lyr"
$ lyric5 run
error[LYR-CLI0007]: package 'tools' has several programs and no src/main.lyr: fmt, lint
  = help: --bin <name> names the one to run
$ lyric5 run --bin fmt
'''

[LYR-CLI0008]
title = "a dependency `add` or `remove` cannot edit"
severity = "error"
area = "14-cli"
summary = "Reported by `add`, `remove` and `update` when the dependency to change is written in `lyric.toml` as a table of its own rather than on one line. The manifest is left as it was; the exit code is 2."
explanation = '''
`add`, `remove` and `update` edit `lyric.toml` line by line and keep every other line as it was, comments included. They change a dependency written on one line, `geo = { path = "../geo" }`; one written as a table, `[dependencies.geo]` with keys below it, is the person's to edit, because rewriting it would mean rewriting text they wrote.

Edit the dependency by hand, or write it on one line once and let the commands handle it from then on.
'''
example = '''
$ cat lyric.toml
[package]
name = "app"
version = "0.1.0"

[dependencies.geo]
path = "../geo"
$ lyric5 add geo --path ../geo2
error[LYR-CLI0008]: 'geo' is written as a table in lyric.toml, not as one line: edit it by hand
'''

