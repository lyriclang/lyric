explanation = '''
`a[i]` works on arrays, slices, inline arrays and types conforming to `Indexable<T>`; the index is an `int`. A range `a[i..j]` takes a view of an array, a slice, a string, a `StringView` or a type with `AsSlice<T>`. `for` walks an `Iterable`, and every `Iterator` is one.

Convert the index with `as int`, or give the type the conformance it is used through.
'''
wrong = '''
fn main(): void {
    let xs = [1, 2, 3];
    let _ = xs[true];
}
'''
right = '''
