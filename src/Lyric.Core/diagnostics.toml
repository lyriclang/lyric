The value of a `loop` is the value of the `break` that ends it. If one `break` gives a value and another gives none, the loop's value would be missing on one path. A `loop` gives a value through every `break` or through none.

Give every `break` a value — a sentinel or an optional (`break null;` with `?int`) for the case without one — or give none and use a variable.
