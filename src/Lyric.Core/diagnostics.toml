A declaration without a word is visible in its package, `pub` everywhere, `private` in its own module only; a field follows the same rule, and a type with a field this module may not name is not built here. An import is its own module's and is never reached through it.

Mark the declaration `pub` (or remove `private`) where it is declared, call a function of its module that does the work, or import the name from the module that declares it.
