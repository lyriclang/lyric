explanation = '''
An initializer and a destructuring pattern name the fields the declaration lists, and no others.

Correct the field's name, or declare the field on the type.
'''
wrong = '''
struct Point { x: int, y: int }

fn main(): void {
    let p = Point { x = 1, y = 2, z = 3 };
