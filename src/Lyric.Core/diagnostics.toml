[LYR-CT0001]
title = "a panic while evaluating at compile time"
severity = "error"
area = "11-metaprogramming"
summary = "Code run at compile time — a `comptime` site, an attribute's value, a macro — panics. The message names the panic and the run-time code (`LYR-RT…`) the built program would have ended with; the notes show where the evaluation went."
explanation = '''
A `comptime` site computes as the built program would: overflow, a division by zero, an index out of bounds, `panic`, `assert`, `try!` on an error and the rest panic there too. A panic at compile time has no program to end, so it is an error at the site, and the run-time code it carries is the one the catalog explains under `LYR-RT…`. A text `std.syntax` cannot parse is reported under this code as well.

Fix the computation or its arguments; the notes point to the frame that panicked.
'''
wrong = '''
fn ratio(a: int, b: int): int {
    return a / b;
}

fn main(): void {
    let r = comptime ratio(1, 0);
    assert(r == 0);
}
'''
right = '''
fn ratio(a: int, b: int): int {
    return a / b;
}

fn main(): void {
    let r = comptime ratio(4, 2);
    assert(r == 2);
}
'''

[LYR-CT0002]
title = "a compile-time evaluation over its budget"
severity = "error"
area = "11-metaprogramming"
summary = "A `comptime` site, or a macro's expansion, runs more interpreter steps than its budget: 50 000 000 by default, or what `comptimeBudget` under `[package]` in the root `lyric.toml` sets."
explanation = '''
Each site has a budget of steps, so a loop that does not end at compile time ends the compilation with an error instead of hanging it. The budget is per site; one site's work does not count against another's.

Make the computation smaller, move it to run time, or raise `comptimeBudget` in the manifest.
'''
wrong = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"
comptimeBudget = 1000
//- src/main.lyr
fn count(n: int): int {
    var i = 0;
    while (i < n) {
        i += 1;
    }
    return i;
}

fn main(): void {
    let n = comptime count(1000000);
    assert(n == 1000000);
}
'''
right = '''
//- lyric.toml
[package]
name = "app"
version = "0.1.0"
comptimeBudget = 1000
//- src/main.lyr
fn count(n: int): int {
    var i = 0;
    while (i < n) {
        i += 1;
    }
    return i;
}

fn main(): void {
    let n = comptime count(100);
    assert(n == 100);
}
'''

[LYR-CT0003]
title = "compile-time code that reaches outside the program"
severity = "error"
area = "11-metaprogramming"
summary = "Code run at compile time calls a native function that reaches the world: the console, files, the clock, the network, processes, the environment."
explanation = '''
Code run at compile time computes from the program text alone, so that a build gives the same result every time and on every machine. The one way to read a file while compiling is `embed`.

Move the call to run time, or compute the value without it.
'''
wrong = '''
import std.io { println };

fn loud(): int {
    println("hello");
    return 1;
}

fn main(): void {
    let n = comptime loud();
    assert(n == 1);
}
'''
right = '''
import std.io { println };

fn loud(): int {
    println("hello");
    return 1;
}

fn main(): void {
    let n = loud();
    assert(n == 1);
}
'''

[LYR-CT0004]
title = "an embed that cannot read its file"
severity = "error"
area = "11-metaprogramming"
summary = "A call to `std.core.embed` would run in the built program instead of at compile time, or names a file that does not exist or lies outside the package's directory."
explanation = '''
`embed(path)` reads a file while the program compiles and makes its content a value of the program. It runs only inside a `comptime` site, and it reads only files within the package, found relative to the file that calls it.

Write `comptime embed("…")`, and check that the path names a file inside the package.
'''
wrong = '''
//- src/main.lyr
import std.core { embed };

fn main(): void {
    let text = embed("greeting.txt");
    assert(text.length() == 4);
}
//- src/greeting.txt
hi!
'''
right = '''
//- src/main.lyr
import std.core { embed };

fn main(): void {
    let text = comptime embed("greeting.txt");
    assert(text.length() == 4);
}
//- src/greeting.txt
hi!
'''

[LYR-CT0005]
title = "a form that does not run at compile time yet"
severity = "error"
area = "11-metaprogramming"
summary = "Code run at compile time reaches something the compile-time interpreter does not run: a coroutine (a generator, `sequence { }`, a task), a native function without a compile-time implementation, a float parsed from text, or a syntax form `std.syntax` has no form for."
explanation = '''
The interpreter that runs `comptime` sites and macros covers most of the language, not all of it. What it does not run is refused at the site, so that a site never computes something different from the built program.

Compute the value at run time, or write the compile-time part without the construct.
'''
wrong = '''
fn total(): int {
    let s = sequence {
        yield 1;
        yield 2;
    };
    var sum = 0;
    for (x in s) {
        sum += x;
    }
    return sum;
}

fn main(): void {
    let n = comptime total();
    assert(n == 3);
}
'''
right = '''
fn total(): int {
    let s = sequence {
        yield 1;
        yield 2;
    };
    var sum = 0;
    for (x in s) {
        sum += x;
    }
    return sum;
}

fn main(): void {
    let n = total();
    assert(n == 3);
}
'''

[LYR-CT0006]
title = "a use of a declaration the build leaves out"
severity = "error"
area = "11-metaprogramming"
summary = "Code that is built for this target uses a declaration whose `@When` condition is false for it, so the declaration is not built."
explanation = '''
`@When(condition)` keeps a declaration only in the builds whose target meets the condition. A use the program would run must therefore stand where the same condition holds, or the program would call what does not exist.

Put the use under `comptime if` with the same condition, or give the declaration a counterpart for the other targets.
'''
wrong = '''
@When(target.pointerWidth == 16)
fn narrow(): int {
    return 16;
}

fn main(): void {
    assert(narrow() == 16);
}
'''
right = '''
@When(target.pointerWidth == 16)
fn narrow(): int {
    return 16;
}

fn main(): void {
    comptime if (target.pointerWidth == 16) {
        assert(narrow() == 16);
    }
}
'''

[LYR-CT0007]
title = "a macro expansion that does not end"
severity = "error"
area = "11-metaprogramming"
summary = "The expansion of macro sites does not finish: after 32 rounds a macro's result still holds a site, or every macro still to be expanded waits for a module whose own sites wait for it."
explanation = '''
A macro's result may hold further macro sites, which the next round expands; a macro runs only once its own module has no sites left. A result that holds its own site again, or two macro modules that each wait for the other, never finish.

Let the macro return syntax without the site it was called from, or move the macros so that their modules do not use each other's.
'''
wrong = '''
//- src/main.lyr
import app.macros { again };

fn main(): void {
    assert(again!(1) == 1);
}
//- src/macros.lyr
import std.syntax { Expr, parseExpr };

pub macro again(n: Expr): Expr {
    return parseExpr(f"again!({n.toSource()})");
}
'''
right = '''
//- src/main.lyr
import app.macros { again };

fn main(): void {
    assert(again!(1) == 1);
}
//- src/macros.lyr
import std.syntax { Expr, parseExpr };

pub macro again(n: Expr): Expr {
    return parseExpr(f"({n.toSource()})");
}
'''

[LYR-ICE0001]
title = "the toolchain crashed"
severity = "error"
area = "16-diagnostics"
summary = "`lyric5` met an exception it did not expect. It prints the exception, where it was in the program if it knows, and its own stack trace, and exits with 101."
explanation = '''
This is a bug in the toolchain, not in the program. The program may be right or wrong; either way the compiler should have answered with a diagnostic.

Report it with the program that triggered it and the full output. Until it is fixed, changing the construct named in the `while …` line usually avoids it.
'''
example = '''
$ cat src/facade.lyr
import app.util { helper };
…
$ cat src/main.lyr
import app.facade { helper };
…
$ lyric5 build
error[LYR-ICE0001]: the toolchain failed: InternalCompilationException: ir: type not lowerable in current version: <error>
  while lowering 'app.main.main' at src/main.lyr:3:1
  = help: this is a bug in lyric5 — please report it with the program that triggered it
   at …
$ echo $?
101
'''

[LYR-ICE0002]
title = "a construct the lowering cannot translate"
severity = "error"
area = "16-diagnostics"
summary = "The checker accepted a construct that the lowering to IR cannot translate. The diagnostic carries the note that it is the compiler's fault."
explanation = '''
The checker is meant to refuse every program the lowering cannot translate, with a code of the language's own. A program that reaches the lowering and is refused there has found a gap between the two: a compiler bug.

Report it with the program. Until it is fixed, writing the construct differently usually avoids it.
'''
example = '''
$ lyric5 build
error[LYR-ICE0002]: …
 --> src/main.lyr:7:9
  = note: the checker accepted this and the lowering cannot translate it — a compiler bug; please report it
'''

[LYR-IR0001]
title = "a construct this compiler version could not lower"
severity = "error"
area = "16-diagnostics"
summary = "The lowering's one code for every refusal until M12a: what the language does not express yet, what the standard library lacked, and its own bugs, all under one number."
retired = "M12a S1: each refusal of the lowering says its reason under a code of its own — LYR-SEM0195, LYR-SEM0196, LYR-SEM0197, or LYR-ICE0002 for a construct the checker accepted and the lowering cannot translate."

[LYR-LEX0001]
title = "a character that starts no token, or a name beyond ASCII"
severity = "error"
area = "01-lexical"
summary = "The source holds a character that begins no token (`$`, a backtick, a control character), or a word holding letters, digits or marks beyond ASCII. A word beyond ASCII is refused once where it stands and read as the name it would be."
explanation = '''
A name is written in ASCII: letters, digits and `_`, not starting with a digit. Characters beyond ASCII may stand in strings, characters and comments, never in a name; a name in another script is refused at every place it is written, and nothing else follows from it. A character that opens no token at all is refused on its own and skipped.

Spell the name in ASCII, or put the character into a string or a comment.
'''
wrong = '''
fn main(): void {
    let größe = 3;
    let _ = größe;
}
'''
right = '''
fn main(): void {
    let size = 3;
    let _ = size;
}
'''

