[LYR-SEM0016]
title = "branches whose types do not unify"
severity = "error"
area = "08-expressions"
summary = "The branches of an `if` expression, the arms of a `match` expression, the parts of a `try` expression or the yields and returns of an inferred lambda produce types that have no common type."
explanation = '''
An expression that chooses between branches has one type, the one every branch fits. Without an expected type, the branches have to agree among themselves: an `int` in one and a `string` in the other give the whole expression no type.

Make the branches produce one type, or declare the type of the binding so each branch is checked against it.
'''
wrong = '''
fn main(): void {
    let flag = true;
