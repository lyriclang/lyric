explanation = '''
Only functions, methods and function values are called. `T(…)` on a type is short for `T.new(…)` and needs that factory; a struct or class is otherwise built with its initializer `T { … }`.

Call a function, build the value with `T { … }`, or declare `static fn new`.
'''
